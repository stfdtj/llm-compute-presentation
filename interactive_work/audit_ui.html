font-size:10px;line-height:1.55;color:#65738a}.tensor-tile strong{font-size:11px;color:#3b4e6b;display:block}.tensor-tile code{font-size:10px;white-space:normal;word-break:break-word}.tensor-tile.weight{border:2px solid #d49430;background:#fff3dc;color:#805818}.tensor-tile.weight strong{color:#8e590e}.tensor-tile.intermediate{background:#edf6fa;border-color:#cce2ed}.tensor-tile.gradient{background:#f3edfa;border-color:#d6c4eb;color:#745395}.tensor-tile.constant{background:#f5f5f5;border-color:#ddd;color:#888}.matrix-grid{display:grid;grid-template-columns:repeat(3,7px);gap:2px;margin:4px 0}.matrix-grid i{height:5px;background:currentColor;opacity:.24;border-radius:1px}.tensor-arrow{align-self:center;color:#7f8ba0;font-size:15px}.parameter-mini-note{font-size:11px;color:#758199;margin:0}.calc-step{border-left:3px solid transparent;padding-left:8px;cursor:pointer;outline:none}.calc-step:focus-visible{outline:2px solid #c79637;outline-offset:3px}.calc-step.current-step{border-left-color:#d39935}.calc-step.current-step .step-title{color:#965d0d}.formula .active-weight{color:#ae6805;background:#fff1ce;border-radius:3px}.row.audit-result{cursor:pointer;border-radius:5px;padding-left:4px;padding-right:4px}.row.audit-result:hover,.row.audit-result:focus-visible{background:#eaf1fc;outline:1px solid #bacbe3}.row.audit-result dd .audit-badge{display:block;width:max-content;margin-left:auto}.result-proof{margin:8px 0 12px;border:1px solid #d3dfed;background:#fbfcff;border-radius:7px;padding:10px;cursor:default;font-size:12px}.result-proof h3{font-size:12px;margin:0 0 7px}.result-proof .proof-caption{color:#6e7b91;font-size:11px;line-height:1.7}.result-proof math{font-size:14px}.result-proof .dimensions{margin:7px 0}.result-proof ul{margin:6px 0;padding-left:18px}.result-proof a,.parameter-detail a{color:#3f659d;overflow-wrap:anywhere}.audit-assumptions{margin:10px 0;border:1px solid #dfe7f2;padding:8px 10px;border-radius:6px;font-size:11px;color:#596b86}.audit-assumptions summary{cursor:pointer;color:#47668e}.assumption-group{margin:10px 0 13px}.assumption-group h3{font-size:12px;margin:0 0 6px;color:#415d87}.assumption-group dl{margin:0;font-size:11px;line-height:1.65}.assumption-group dt{font-weight:600;color:#485d7d;margin-top:7px}.assumption-group dd{margin:2px 0 0;color:#6a7990}.moe-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.moe-stat{border:1px solid #e0e6f2;border-radius:6px;background:white;padding:8px;font-size:11px;color:#69768b}.moe-stat strong{display:block;color:#364f75;font-size:13px}.expert-demo{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:7px 0;color:#6c7890;font-size:11px}.expert-demo span{border:1px solid #ccb9e5;border-radius:4px;padding:3px 6px;background:#f4effb;color:#7855a1}.expert-demo .shared{background:#edf8f0;border-color:#adcfb7;color:#437854}.audit-counts{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.audit-counts span{padding:5px 7px}.audit-global-intro{font-size:13px;line-height:1.7;color:#536887}.audit-history{margin:12px 0;font-size:11px;line-height:1.7}.audit-history summary{cursor:pointer;color:#526e98}.audit-history li{margin:8px 0}.proof-linear{padding:7px;background:#f0f5fc;border-radius:5px;margin:8px 0;font-size:11px;line-height:1.7;overflow-wrap:anywhere}.parameter-empty{font-size:12px;color:#69798f}.parameter-row:focus-visible{outline:2px solid #d39935;outline-offset:-2px}

<script>
(()=>{
 const AUDIT=JSON.parse(document.getElementById('audit-data').textContent);
 const fmt=n=>Number(n).toLocaleString('en-US'),shape=s=>'['+s.join(',')+']';
 const badge=s=>`<span class="audit-badge ${esc(s)}">${esc(s)}</span>`;
 let activeStep=0;
 const aliases={qa:['WQA'],qb:['WQB'],kv:['WKV'],ckv:['WKV'],qnorm:['γ'],kvnorm:['γ'],anorm:['γ'],fnorm:['γ'],finalnorm:['γ'],cnorm:['γ'],inorm:['γ'],oa:['WOAg','WOA'],ob:['WOB'],router:['WR'],bias:['b'],bias_vl:['biasvl'],w1:['W1'],w2:['W2'],w3:['W3'],iq:['WIQ','WI'],ih:['WIH','Wh'],ik:['WIK'],cgate:['Wgate'],hc_fn:['WHC'],hc_base:['base'],hc_scale:['scale'],ew:['WE'],eq:['wq'],ek:['wk'],embedding:['E'],etable1:['E'],etable14:['E'],head:['Whead'],sink:['asink']};
 const normalized=s=>s.replace(/[\s_{}(),]/g,'');
 function assumptions(groups){return Object.entries(groups).map(([cat,items])=>`<section class="assumption-group" data-assumption="${cat}"><h3>${cat}</h3><dl>${items.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')||'<dd>沿用全局条件。</dd>'}</dl></section>`).join('');}
 function evidence(items){const seen=new Set();return items.filter(e=>{const k=e.file+':'+e.line;if(seen.has(k))return false;seen.add(k);return true;}).map(e=>`<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.file)}:${e.line} · ${esc(e.symbol)}</a></li>`).join('');}
 function parameterRows(items){return items.map(p=>`<tr class="parameter-row" data-parameter="${p.bindingId}" tabindex="0" role="button" aria-label="${esc(p.name)} ${shape(p.shape)}"><td><span class="parameter-name">${esc(p.name)}</span><small>${esc(p.kind||p.role)}${!p.owned?' · 引用，不重复计数':''}</small></td><td><span class="parameter-shape">${shape(p.shape)}</span>${p.multiplicity>1?'<small>× '+fmt(p.multiplicity)+' 套</small>':''}</td><td>${fmt(p.total)}${badge(p.status)}</td></tr>`).join('');}
 function table(items){return `<div class="parameter-table-wrap"><table class="parameter-table"><thead><tr><th>Parameter</th><th>Shape · XW</th><th>Parameter Count</th></tr></thead><tbody>${parameterRows(items)}</tbody></table></div>`;}
 function moeSummary(s){return `<div class="moe-stat-grid"><div class="moe-stat">Total · 一层含 Router<strong>${fmt(s.total)}</strong></div><div class="moe-stat">Activated · 当前文本 token<strong>${fmt(s.activated)}</strong></div><div class="moe-stat">专家存储小计 · 384 + 1<strong>${fmt(s.expertsTotal)}</strong></div><div class="moe-stat">专家激活小计 · 6 + 1<strong>${fmt(s.expertsActivated)}</strong></div></div><div class="expert-demo">Top-6 → ${[1,2,3,4,5,6].map(i=>`<span>I${i}</span>`).join('')} + <span class="shared">1 Shared</span></div><p class="parameter-caption">I₁…I₆ 为示意编号，未运行实际路由。Shared Expert 每个 token 执行，各层有各自权重。Router ${fmt(s.router)} 个另列，已包含在 Total 内。</p><details class="parameter-detail"><summary>40 层总量与共享边界</summary><p>Total ${fmt(s.fortyTotal)}；本 token Activated ${fmt(s.fortyActivated)}。子模块引用不再加一次；Shared 不表示跨层绑权。文本路径未使用图像选择偏置。</p></details>`;}
 function parameterBox(d,m){const ps=d.learnable;return `<section class="parameter-box" aria-label="Learnable Parameters"><h2>Learnable Parameters${!ps.length?': 0':''}</h2><p class="parameter-caption">${ps.length?`${fmt(d.ownedParameters)} 个结构权重 · ${ps.some(p=>!p.owned)?'另列共享引用':'当前模块'}。点击下面的计算步骤，追踪正在使用的权重。`:esc(d.nonLearned)}</p>${d.moeSummary?moeSummary(d.moeSummary):''}${ps.length?table(ps.slice(0,3)):''}${ps.length>3?`<details class="parameter-detail" id="more-parameters"><summary>展开全部 ${ps.length} 项参数</summary>${table(ps.slice(3))}</details>`:''}<div class="parameter-step-picker">${m.steps.map((s,i)=>`<button data-select-step="${i}" aria-pressed="false">${i+1} · ${esc(selected==='query'?['W_QA','RMSNorm γ','W_QB'][i]||s.title:s.title)}</button>`).join('')}</div><div id="parameter-mini"></div><p class="parameter-mini-note" id="parameter-mini-note"></p><details class="parameter-detail"><summary>参数用途、共享与存储形状</summary>${ps.map(p=>`<p><strong>${esc(p.name)}</strong> · ${esc(p.role)}<br>逻辑 Shape ${shape(p.shape)}，${fmt(p.count)} 个数字${p.multiplicity>1?' × '+p.multiplicity+' 套':''}；存储权重轴 ${shape(p.storedShape)}。${esc(p.sharing)}<br><a href="${esc(p.evidence.url)}" target="_blank" rel="noopener">${esc(p.evidence.file)}:${p.evidence.line}</a></p>`).join('')}<p>公式使用行向量 XW；PyTorch Linear 按 [输出,输入] 存储，并在计算时转置。FP4 的物理打包与 scale 元数据另计。结构可学习不代表本次训练的 requires_grad；推理实现没有提供冻结策略。</p><p>${esc(d.nonLearned)}</p></details></section>`;}
 const grid='<div class="matrix-grid" aria-hidden="true">'+Array(9).fill('<i></i>').join('')+'</div>';
 function tile(kind,title,content){return `<div class="tensor-tile ${kind}"><strong>${title}</strong>${grid}<code>${content}</code></div>`;}
 function activate(i,focusRow=false){
  if(!selected)return;const d=DATA[selected],m=d[mode],s=m.steps[i];if(!s)return;activeStep=i;
  const refs=new Set(s.parameterRefs),ps=d.learnable.filter(p=>refs.has(p.bindingId));
  body.querySelectorAll('.parameter-row').forEach(row=>{const hot=refs.has(row.dataset.parameter);row.classList.toggle('parameter-active',hot);row.setAttribute('aria-pressed',String(hot));if(hot&&row.closest('#more-parameters'))row.closest('details').open=true;});
  body.querySelectorAll('[data-select-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.selectStep)===i)));
  body.querySelectorAll('.calc-step[data-step-index]').forEach(n=>n.classList.toggle('current-step',Number(n.dataset.stepIndex)===i));
  body.querySelectorAll('.active-weight').forEach(n=>n.classList.remove('active-weight'));
  const current=body.querySelector(`.calc-step[data-step-index="${i}"]`);
  if(current){const names=ps.flatMap(p=>aliases[p.parameterId]||[]);current.querySelectorAll('msub,mi').forEach(n=>{if(names.includes(normalized(n.textContent))&&!n.closest('msub')?.classList.contains('active-weight'))n.classList.add('active-weight');});}
  const weight=ps.length?ps.slice(0,3).map(p=>esc(p.name)+' '+shape(p.shape)).join('<br>')+(ps.length>3?'<br>另 '+(ps.length-3)+' 项，见参数表':''):d.learnable.length?'此步是整块计算概括；点击参数行查看分解':'此步没有权重';
  const dimensions=s.dimensions.join('');
  const dimsText=new DOMParser().parseFromString('<div>'+dimensions+'</div>','text/html').body.textContent;
  const shapes=[...dimsText.matchAll(/\[[\d,\s]+\]/g)].map(x=>x[0].replaceAll(' ',''));
  const input=mode==='backward'?'dY · 输入梯度':'X / 当前 Activation';
  const mini=body.querySelector('#parameter-mini');
  if(mini)mini.innerHTML=`<div class="current-formula"><div class="subhead">正在追踪 · ${esc(s.title)}</div><div class="formulas">${formulas(s.formulas)}</div></div><div class="parameter-mini">${tile(mode==='backward'?'gradient':'activation',input,(shapes[0]||'形状见下方')+(mode==='backward'?'<br>运行时梯度':'<br>运行时输入'))}<span class="tensor-arrow">→</span>${tile(ps.length?'weight':'constant',ps.length?'Learnable Parameter':'Fixed / Operation',weight)}<span class="tensor-arrow">→</span>${tile(mode==='backward'?'gradient':'intermediate',mode==='backward'?'dX / dW · Gradient':'Intermediate Tensor',(shapes.at(-1)||'形状见下方')+'<br>'+(mode==='backward'?'梯度不是新增参数':'计算结果，不是权重'))}</div><div class="dimensions">${dimensions}</div><details class="parameter-detail"><summary>当前公式的变量解释</summary><dl class="symbols">${s.symbols.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></details>`;
  if(mini){const names=ps.flatMap(p=>aliases[p.parameterId]||[]);mini.querySelectorAll('.current-formula msub,.current-formula mi').forEach(n=>{if(names.includes(normalized(n.textContent))&&n.previousElementSibling?.textContent!=='d')n.classList.add('active-weight');});}
  const note=body.querySelector('#parameter-mini-note');if(note)note.textContent=ps.length?ps.map(p=>`${p.name}：${p.shape.join(' × ')} = ${fmt(p.count)} 个数字需要学习${p.multiplicity>1?'，本模块 '+p.multiplicity+' 套':''}`).join('；')+(mode==='backward'?'。dW 是更新这些权重所用的梯度。':''):d.learnable.length?'本步没有显式展开具体权重；点击参数行查看对应子步骤或结构视图。':'当前步骤处理激活、缓存、索引或固定操作，没有新的可学习权重。';
  if(focusRow){const row=body.querySelector('.parameter-active');if(row){const container=row.closest('.parameter-table-wrap');container.scrollTop=row.offsetTop-container.offsetTop;}}
 }
 function resultProof(row,record,m,d){
  const existing=row.nextElementSibling;if(existing?.classList.contains('result-proof')){existing.remove();row.setAttribute('aria-expanded','false');return;}
  body.querySelectorAll('.result-proof').forEach(n=>n.remove());body.querySelectorAll('.audit-result').forEach(n=>n.setAttribute('aria-expanded','false'));
  const proof=document.createElement('div');proof.className='result-proof';
  const arithmetic=m.linearArithmetic.map(t=>`<div class="proof-linear">线性 ${shape(t.input)} × ${shape(t.weight)} → ${shape(t.output)}${t.multiplicity>1?' · × '+t.multiplicity+' 组':''}<br>权重 ${fmt(t.parameters)}；前向近似 2MKN = ${fmt(t.forwardApprox)}，精确 MN(2K−1) = ${fmt(t.forwardExact)}。<br>dX ${shape(t.dxShape)}：近似 ${fmt(t.dxApprox)} / 精确 ${fmt(t.dxExact)}；dW ${shape(t.dwShape)}：近似 ${fmt(t.dwApprox)} / 精确 ${fmt(t.dwExact)}。</div>`).join('');
  const ps=d.learnable;
  proof.innerHTML=`<h3>${esc(record.label)} ${badge(record.status)}</h3><p class="proof-caption">${esc(m.audit.basis)}。当前 ${record.status==='Verified'?'通过结构、配置和独立逻辑计数核验':record.status==='Estimated'?'为明示条件下的理论估算':'完整数值尚未可靠验证'}。</p><div class="formulas">${formulas(m.calculations)}</div><details class="audit-assumptions"><summary>公式、输入 / 权重 / 输出 Shape</summary>${m.steps.map(s=>`<p>${esc(s.title)}</p><div class="formulas">${formulas(s.formulas)}</div><div class="dimensions">${formulas(s.dimensions)}</div>`).join('')}</details>${arithmetic}<details class="audit-assumptions"><summary>本项 Assumptions · 四类条件</summary>${assumptions(d.moduleAssumptions)}<p>未列出的条件沿用全局 Assumptions。</p></details><details class="audit-assumptions"><summary>独立复核与来源文件 / 代码位置</summary><p>固定官方版本 ${AUDIT.revision.slice(0,12)}；由正式配置和源码权重构造建立唯一清单，再对比页面。参数独立小计 ${fmt(d.ownedParameters)}${ps.some(p=>!p.owned)?'，共享引用不重复累计':''}。</p><ul>${evidence(m.audit.evidence)}</ul><p>验证脚本：interactive_work/audit_model.py、verify_audit.py。前向特殊操作为简化计数，反向为实数数学推导；未运行完整模型训练内核。</p></details>`;
  row.after(proof);row.setAttribute('aria-expanded','true');
 }
 const original=drawPanel;
 drawPanel=function(resetScroll=true){
  original(resetScroll);if(!selected)return;const d=DATA[selected],m=d[mode];
  const box=document.createElement('div');box.innerHTML=parameterBox(d,m);const first=body.querySelector('.section');if(first)first.after(box.firstElementChild);
  if(selected==='query'&&mode==='backward')body.querySelectorAll('[data-select-step]').forEach((b,i)=>b.textContent=(i+1)+' · '+['W_QB','RMSNorm γ','W_QA'][i]);
  if(mode!=='parameter'){const note=document.createElement('p');note.className='count-explain';note.textContent=m.linearArithmetic.length?'矩阵结果采用 2MKN 近似；点击数值可查看精确乘加及独立复核。':'当前结果为明示场景下的理论估算；特殊操作、矩阵小计及未验证边界可点数值查看。';body.querySelector('.teaching-result')?.prepend(note);}
  body.querySelectorAll('.calc-step').forEach((n,i)=>{if(i>=m.steps.length)return;n.dataset.stepIndex=i;n.tabIndex=0;n.setAttribute('role','button');n.setAttribute('aria-label','追踪 '+m.steps[i].title);});
  const resultRows=[...body.querySelectorAll('.teaching-result .row')],totalRows=[...body.querySelectorAll('.extra:not(.teaching-example) > .values .row')];
  [...resultRows.map((r,i)=>[r,m.resultAudits[i]]),...totalRows.map((r,i)=>[r,m.totalAudits[i]])].forEach(([r,rec])=>{if(!rec)return;r.classList.add('audit-result');r.tabIndex=0;r.setAttribute('role','button');r.setAttribute('aria-expanded','false');r.setAttribute('aria-label',rec.label+' '+rec.value+' '+rec.status+'；查看依据');r.querySelector('dd').insertAdjacentHTML('beforeend',badge(rec.status));r.addEventListener('click',()=>resultProof(r,rec,m,d));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();resultProof(r,rec,m,d);}});});
  const folded=document.createElement('details');folded.className='audit-assumptions';folded.innerHTML='<summary>本模块 Assumptions / 统计边界</summary>'+assumptions(d.moduleAssumptions);body.append(folded);
  activate(0);if(resetScroll)body.scrollTop=0;
 };
