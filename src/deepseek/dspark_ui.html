<style>
.dspark-topic{cursor:pointer;outline:none}.dspark-topic:hover>.surface,.dspark-topic:focus-visible>.surface{stroke:#7942bb;stroke-width:2;filter:drop-shadow(0 1px 2px #7a4ab933)}.dspark-topic:focus-visible>.hit-label{stroke:#7942bb;stroke-width:2}.dspark-topic text{pointer-events:none}.dspark-card[hidden]{display:none!important}.dspark-card{position:fixed;right:24px;top:calc(var(--header-height,106px) + 10px);width:450px;max-width:calc(100vw - 24px);max-height:calc(100dvh - var(--header-height,106px) - 28px);display:flex;flex-direction:column;background:#fff;border:1px solid #bca0da;border-radius:12px;box-shadow:var(--shadow);z-index:12;overflow:hidden}.dspark-card-head{padding:16px 18px 12px;background:#f8f3ff;border-bottom:1px solid #e8ddf3;position:relative}.dspark-card-head small{font-size:10px;color:#8a64ab}.dspark-card-head h1{font-size:18px;line-height:1.5;margin:4px 28px 4px 0}.dspark-card-head p{font-size:11px;color:#7a6b8b;margin:0}.dspark-card-close{position:absolute;right:9px;top:9px;border:0;background:transparent;font-size:23px;color:#8a749e;padding:0 7px}.dspark-card-body{padding:15px 18px;overflow:auto;font-size:13px;line-height:1.75}.dspark-card-body p{margin:0 0 12px}.dspark-mini-flow{border:1px solid #dac9ed;background:#faf6ff;color:#664086;border-radius:7px;padding:10px 12px;line-height:1.9;font-size:12px;margin-bottom:12px}.dspark-card-body h2{font-size:12px;margin:14px 0 5px;color:#79549b}.dspark-card-body .dspark-reference{font-size:10px;color:#7d8596;border-top:1px solid #e8edf4;padding-top:10px;margin-top:12px;overflow-wrap:anywhere}.dspark-card-actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.dspark-card-actions button{font-size:11px;padding:6px 9px;color:#6d4395}.dspark-implementation{border-left:3px solid #c4a05e;background:#fff9ee;padding:8px 10px;font-size:11px;color:#80632c}.pipeline-active .dspark-card,.csa-walkthrough-active .dspark-card{display:none!important}@media(max-width:780px){.dspark-card{right:12px;width:calc(100vw - 24px)}}
</style>
<aside id="dspark-card" class="dspark-card" role="dialog" aria-modal="false" aria-labelledby="dspark-card-title" hidden>
 <div class="dspark-card-head"><small>DSpark · 主架构中的 Draft 分支</small><h1 id="dspark-card-title"></h1><p id="dspark-card-status"></p><button id="dspark-card-close" class="dspark-card-close" aria-label="关闭 DSpark 说明">×</button></div><div id="dspark-card-body" class="dspark-card-body"></div>
</aside>
<script>
(()=>{
 const card=document.getElementById('dspark-card'),title=document.getElementById('dspark-card-title'),body=document.getElementById('dspark-card-body');let opener=null;
 const boundary='公开 model.py 实现 Backbone forward 和 DSpark forward。公开 generate.py 仍逐 token 调用 Backbone，没有调用 forward_spec 的完整 Draft → Verify → Accept/Reject 循环。';
 const topics={
 anchor:{title:'Anchor Token 从哪里来？',flow:'40 层 Backbone → Final RMSNorm → LM Head → Logits → 选词 / 采样 → Anchor',text:'Anchor Token 就是主 Backbone 在当前 Decode 步先产生的那个 token。它是可信的 Target 输出，随后作为 DSpark 的起点；不是由 Draft 模块凭空生成。',extra:'已选中 Anchor 不代表已算出它自己的 Target KV：本次 Forward 处理的是前一个输入，Anchor 通常要到下一次 Target Forward 才作为输入处理。',source:'Transformer.forward · self.norm → self.head → sample → output_ids'},
 features:{title:'第 37 / 38 / 39 层特征做什么？',flow:'指定层执行前的输入 → mHC 流取均值 → 拼接 → main_proj → main_norm → main_x',text:'Backbone 保留这三个深层位置的特征（0-based）。DSpark 用投影后的 main_x 作为上下文；每个 Draft Block 再为自己的私有窗口生成 KV。',extra:'这些不是最终 LM Head 的 Logits，也不是候选 token。Anchor 的 token 路径与特征的上下文路径在 DSpark 输入准备处会合。',source:'Transformer.forward · main_hiddens / torch.cat；DSparkBlock.forward_embed · main_proj + main_norm'},
 input:{title:'五个槽位如何初始化？',flow:'[Anchor, Noise, Noise, Noise, Noise] → 共享 Embedding → 五位置隐藏状态',text:'位置 0 放当前 Backbone 选出的 Anchor；其余 4 个位置从噪声占位 token 开始（配置 ID 128799）。不是先准备好五个真实生成 token 再送进 Draft。',extra:'三个 mtp Blocks 依次处理同一个五位置 block。三个网络块和五个输出位置是两种不同的数量。',source:'DSparkBlock.forward_embed；dspark_block_size=5'},
 blocks:{title:'3 个额外 Draft Blocks',flow:'5 个槽位 → mtp[0] → mtp[1] → mtp[2] → mHC collapse → Norm → 共享 LM Head',text:'每一个 Block 都处理全部五个槽位。最后的共享 LM Head 对五个位置产生基础 Logits，再交给轻量 Markov Head 顺序选词。',extra:'主 Backbone 仍是 40 层。mtp[0..2] 由 forward_spec 单独调用，不是普通 Backbone Forward 必须追加的层，也不替代 Target。',source:'Transformer.forward_spec；DSparkBlock.forward_head'},
 markov:{title:'Markov Head 为什么是顺序的？',flow:'前一 token ID → 轻量 Markov bias → 加到当前位置的基础 Logits → 采样 → 下一 token',text:'先用 Anchor 调整第一个位置，再用刚选出的第一个 Draft token 调整第二个位置，依此产生最多五个候选。它补充局部 token 依赖，不是另一个完整 Transformer 栈。',extra:'三个 Draft Blocks 对五个槽位做 block 计算；后面的 Markov 选词循环才按位置顺序执行。',source:'DSparkMarkovHead（rank 256）；forward_head 的 for i in range(block_size)'},
 confidence:{title:'Confidence Head 输出什么？',flow:'Draft hidden + 前一 token 的 Markov embedding → Confidence Head → 每位置 score',text:'这些分数用于估计草稿位置有多可靠，再供 Scheduler 决定值得验证多长的候选前缀。它们不等同于词表提议概率 q，也不是 Target 的验证结果。',extra:'参考代码返回原始 Confidence scores；完整的置信校准、引擎负载感知和验证长度选择属于服务层，这里不虚构阈值。',source:'DSparkConfidenceHead；forward_head 返回 output_ids, logits, confidence'},
 verification:{title:'候选必须交回 Backbone 验证',flow:'Draft IDs + Confidence → Scheduler → 同一个 Target Backbone ×40 → Accept / Reject → 下一轮',text:'DSpark 只负责提议候选。主 Backbone 仍产生可信分布；runtime 保留接受前缀，拒绝处之后的草稿不能提交，随后进入下一轮。',extra:'Pipeline 中可逐位置查看：输入、Logits、概率、接受判断，以及有效 KV 的边界。该完整服务循环是教学概念，不声称公开 generate.py 已实现。',source:'标准 speculative decoding 流程；model.py / generate.py 的实现边界'},
 implementation:{title:'参考代码与概念服务循环',flow:'已实现：Backbone forward + DSpark forward\n概念：调度 → Backbone Verification → Accept / Reject → 状态提交',text:boundary,extra:'forward_spec(start_pos=0) 仅播种 DSpark 私有窗口 KV，并返回 None；正的 start_pos 才进入 Draft 产出路径。页面从已有历史后的当前 Backbone Decode 展开，避免把 Prefill 播种误画成直接产出五候选。',source:'公开 inference/model.py · forward / forward_spec；inference/generate.py · generate'}
 };
 function close(restore=false){card.hidden=true;if(restore&&opener?.isConnected)opener.focus();}
 function open(topic,node){const t=topics[topic];if(!t)return;closePanel();opener=node;title.textContent=t.title;document.getElementById('dspark-card-status').textContent=['verification','implementation'].includes(topic)?'实现边界 · 参考模块 / 概念服务循环':'源码已核实 · 不改变现有计算范围';body.innerHTML='<div class="dspark-mini-flow"></div><p></p><p></p><div class="dspark-card-actions"><button data-dspark-action="detail">查看三块内部结构</button><button data-dspark-action="pipeline">跟着数据走一轮</button></div><div class="dspark-implementation"></div><div class="dspark-reference"></div>';body.querySelector('.dspark-mini-flow').textContent=t.flow;body.querySelectorAll('p')[0].textContent=t.text;body.querySelectorAll('p')[1].textContent=t.extra;body.querySelector('.dspark-implementation').textContent=boundary;body.querySelector('.dspark-reference').textContent=t.source;card.hidden=false;document.getElementById('dspark-card-close').focus();}
 function activate(e){if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;const node=e.target.closest('[data-dspark-topic]');if(!node)return;e.preventDefault();e.stopImmediatePropagation();open(node.dataset.dsparkTopic,node);}
 const architecture=document.getElementById('architecture');architecture.addEventListener('click',activate,true);architecture.addEventListener('keydown',activate,true);
 document.getElementById('dspark-card-close').onclick=()=>close(true);body.onclick=e=>{const action=e.target.closest('[data-dspark-action]')?.dataset.dsparkAction;if(action==='detail'){close();window.attentionBlocks.focus('draft');}if(action==='pipeline'){close();document.getElementById('csa-tab-pipeline').click();}};
 document.addEventListener('keydown',e=>{if(!card.hidden&&e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close(true);}},true);
 document.querySelector('.csa-view-tabs').addEventListener('click',()=>close());for(const id of ['reset','region-select','flow-toggle'])document.getElementById(id).addEventListener(id==='region-select'?'change':'click',()=>close());
})();
</script>
