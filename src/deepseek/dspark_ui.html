<style>

.ds-header{position:sticky;top:0;background:#f7f2ff;padding:12px 18px;border-bottom:1px solid #ded0f1;z-index:2;display:flex;gap:12px;align-items:center}.ds-header strong{font-size:19px;color:#56298c}.ds-header button{margin-left:auto}.ds-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0}.ds-tabs button{font-size:12px}.ds-tabs button[aria-selected=true]{background:#efe6ff;border-color:#a66aff;color:#62389a}.ds-content{padding:14px 18px 22px}.ds-content h2{font-size:18px;margin:0 0 9px;color:#56298c}.ds-content h3{font-size:14px;margin:0 0 5px}.ds-content p{margin:8px 0}.ds-content code{font:13px/1.8 Consolas,monospace;overflow-wrap:anywhere}.ds-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.ds-cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}.ds-card{background:#fbf8ff;border:1px solid #d6c0ee;border-radius:7px;padding:12px}.ds-op{padding:8px 10px;border:1px solid #b0cdeb;border-radius:5px;background:#edf6ff;text-align:center}.ds-op.norm{background:#e2f7e9;border-color:#60c787}.ds-op.draft{background:#efe6ff;border-color:#a66aff}.ds-op.cache{background:#fff3d8;border:1px dashed #efba36}.ds-down{text-align:center;color:#8650c6;font-weight:700;line-height:22px}.ds-note{padding:9px 12px;background:#fff8e9;border-left:3px solid #e3b64f;border-radius:3px;color:#6e5318;font-size:13px}.ds-source{padding-top:10px;border-top:1px solid #e1e8f0;color:#64738e;font-size:12px;margin-top:15px}.ds-source a{color:#446da3}.ds-table{border-collapse:collapse;width:100%;font-size:13px}.ds-table th,.ds-table td{border:1px solid #d9dfee;padding:8px;text-align:left;vertical-align:top}.ds-table th{background:#f1f5fc}.ds-positions{display:flex;gap:7px;margin:8px 0;flex-wrap:wrap}.ds-position{padding:7px 13px;border:1px dashed #a66aff;background:#efe6ff;border-radius:5px}.ds-position.accepted{background:#e2f7e9;border:1px solid #60c787}.ds-position.rejected{background:#ffe7ed;border:1px solid #ff476f}.ds-position.omitted{opacity:.35}.ds-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.ds-controls input{width:120px}.ds-stage-grid{display:grid;grid-template-columns:100px repeat(5,1fr);gap:5px;margin:10px 0}.ds-stage-grid span{padding:5px;text-align:center;background:#efe6ff;border-radius:4px}.ds-stage-grid strong{padding:5px;color:#64358d}.ds-flow-label{font-size:12px;color:#7d55a1}.ds-cards .ds-op{font-size:13px}
@media(max-width:780px){#dspark-dialog{width:96vw;max-width:96vw}.ds-cards,.ds-cards.two{grid-template-columns:1fr}.ds-header strong{font-size:15px}.ds-content{padding:10px 12px}.ds-tabs{padding:10px 12px 0}.ds-stage-grid{grid-template-columns:70px repeat(5,1fr);font-size:10px}.ds-position{padding:5px 8px}}

<template id="dspark-svg-template"><svg xmlns="http://www.w3.org/2000/svg">__DSPARK_SVG__</svg></template>
<dialog id="dspark-dialog" aria-labelledby="ds-title">
 <div class="ds-header"><strong id="ds-title">DSpark · 3 Draft Layers × 5 Draft Positions</strong><button id="ds-close">返回架构 ×</button></div>
 <nav id="ds-tabs" class="ds-tabs" role="tablist" aria-label="DSpark 计算详情"></nav>
 <div id="ds-content" class="ds-content" role="tabpanel"></div>
</dialog>
<script>
(()=>{
 const c=__DSPARK_CONFIG__,template=document.getElementById('dspark-svg-template');
 for(const child of [...template.content.querySelector('svg').children])svg.append(child.cloneNode(true));template.remove();
 const overview=document.getElementById('dspark-overview'),dialog=document.getElementById('dspark-dialog'),content=document.getElementById('ds-content'),tabs=document.getElementById('ds-tabs'),region=document.getElementById('region-select');
 const option=new Option('总览 · 主干 + DSpark','dspark');region.prepend(option);
 const launch=document.createElement('button');launch.id='dspark-launch';launch.textContent='主干 + DSpark';launch.setAttribute('aria-pressed','false');document.querySelector('.tools').prepend(launch);
 let active=false,savedView=null,savedRegion='all',tab='inputs',markovPosition=1;
 const h=c.dim,v=c.vocab_size,b=c.dspark_block_size,r=c.dspark_markov_rank,hc=c.hc_mult,q=c.q_lora_rank,k=c.head_dim,a=c.n_heads,groups=c.o_groups,orank=c.o_lora_rank,concat=h*c.dspark_target_layer_ids.length;
 const source=`<div class="ds-source">草稿前向：<a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/inference/model.py" target="_blank" rel="noopener">官方 model.py · Transformer.forward / forward_spec、DSparkBlock、DSparkAttention</a>；<a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/inference/config.json" target="_blank" rel="noopener">官方配置</a>。验证与调度：<a href="https://arxiv.org/html/2607.05147v1#S2.SS1" target="_blank" rel="noopener">DSpark 论文 §2.1</a>、<a href="https://arxiv.org/html/2607.05147v1#S3.SS2" target="_blank" rel="noopener">§3.2</a>；V4.1 技术报告 §2.4.3。论文流程不等于此文件已实现完整推理引擎。</div>`;
 const op=(s,kind='')=>`<div class="ds-op ${kind}">${s}</div>`,chain=xs=>xs.join('<div class="ds-down" aria-hidden="true">↓</div>');
 const positions=(prefix='p')=>Array.from({length:b},(_,i)=>`<span class="ds-position">${prefix}${i+1}</span>`).join('');
 const views={
  inputs:()=>`<h2>两种来源：主干条件 A + 主模型锚点 token B</h2><div class="ds-cards two"><section class="ds-card"><h3>A · 读取进入 L${c.dspark_target_layer_ids.join(' / ')} 前的状态</h3>${chain([op(`每层的 Block 输入 h [1,S,${hc},${h}]<br>mean(dim=2) → 每层 [1,S,${h}]`),op(`Concat 三层特征（最后一维）<br>[1,S,${concat}]`,'draft'),op(`main_proj [${concat},${h}] → main_norm<br>main_x [1,S,${h}]`,'norm'),op('同一 main_x 交给 3 个 Draft Attention<br>各层用自己的 W_KV 生成上下文缓存','cache')])}<p>位置在 <code>layer(h,…)</code> 调用之前。这里是四路状态的算术均值，尚未执行该层内部的 HC Pre / Attention RMSNorm；不是 L37–39 的最终输出。</p></section><section class="ds-card"><h3>B · 主模型正常输出 t₀，作为草稿锚点</h3>${chain([op(`输入一个 token ID t₀；Noise ID=${c.dspark_noise_token_id}<br>draft_input_ids=[t₀, noise, noise, noise, noise]`,'draft'),op(`共享主模型 Embedding 表 [${v},${h}]<br>查表 → [1,${b},${h}]`),op(`扩展 ${hc} 路残差 → [1,${b},${hc},${h}]<br>初始 Pre mix = [1,0,0,0]`,'draft')])}<div class="ds-positions">${positions()}</div><p><strong>block_size=${b} 是位置数，n_mtp_layers=${c.n_mtp_layers} 是网络深度。</strong>一个锚点 + 四个 noise 提供 5 个预测位置；锚点位置本身也预测第一个新候选。</p></section></div>`,
  blocks:()=>`<h2>3 个附加 Draft Blocks；每一层同时处理 5 个位置</h2><div class="ds-stage-grid"><strong>深度 / 位置</strong>${Array.from({length:b},(_,i)=>`<span>Position ${i+1}</span>`).join('')}${Array.from({length:c.n_mtp_layers},(_,i)=>`<strong>Draft ${i+1}</strong>${Array.from({length:b},(_,j)=>`<span>p${j+1} → h${i+1},${j+1}</span>`).join('')}`).join('')}</div><div class="ds-cards">${Array.from({length:c.n_mtp_layers},(_,i)=>`<section class="ds-card"><h3>Draft Block ${i+1} · mtp.${i}</h3><p>输入 ${i?'前一 Draft Block 输出':'Embedding 扩展四路结果'}<br><code>[1,${b},${hc},${h}]</code></p>${chain([op('HC mixes；使用传入的 Pre 合并四路'),op('Attention RMSNorm','norm'),op('DSparkAttention<br>Q 来自本层草稿；KV = 上下文 + 整块草稿','draft'),op('HC Post / Comb 更新残差'),op('HC Pre → FFN RMSNorm','norm'),op(`MoE：${c.dspark_n_routed_experts} routed 中选 ${c.dspark_n_activated_experts}<br>+ ${c.n_shared_experts} shared；SwiGLU ${h}→${c.moe_inter_dim}→${h}`,'draft'),op('HC Post / Comb → 四路输出')])}<p>输出 <code>[1,${b},${hc},${h}]</code> 与下一阶段的 Pre mix。${i===2?'最后再执行 Head 的 HC Pre / Norm。':'传给下一个 Draft Block。'}</p></section>`).join('')}</div><p class="ds-note">3 层在深度方向串行；5 个位置在同一层内成块计算。不会为每个候选重复执行这 3 层，也不把它们接成主模型必经的 L40–42。检查点内部索引 40–42 仅是存储编号。</p>`,
  attention:()=>`<h2>Draft Attention：上下文窗口 + 5 个草稿位置</h2><div class="ds-cards two"><section class="ds-card"><h3>上下文来源</h3>${chain([op(`main_x [1,1,${h}] × 本 Draft 层 W_KV [${h},${k}]`),op(`KV RMSNorm → 尾 ${c.rope_head_dim} 维 RoPE → FP8`,'norm'),op(`写本 Draft 层上下文环形缓存 [1,${c.window_size},${k}]`,'cache')])}<p>三个 Draft 层读取相同的 main_x，但各自的投影权重与缓存独立；不直接借用主干的 Global KV Cache。</p></section><section class="ds-card"><h3>草稿本身的 Q / KV 与输出</h3>${chain([op(`草稿层 HC Pre / Norm 得到 X [1,${b},${h}]`),op(`Q: W_Q(L) → RMSNorm → W_Q(R) → RoPE<br>Q [1,${b},${a},${k}]`),op(`KV: W_KV → RMSNorm → RoPE → FP8<br>[1,${b},${k}]`),op(`上下文 ≤${c.window_size} + 草稿 ${b} 行 → 一次 sparse_attn`,'draft'),op('Inverse RoPE → 分组 W_OA → W_OB<br>U [1,5,5120]')])}</section></div><table class="ds-table"><tr><th>维度</th><th>主干 Attention</th><th>DSparkAttention</th></tr><tr><td>历史上下文</td><td>本层 Local + 条件启用 Global / Top-K</td><td>main_x 投影而来的本 Draft 层窗口 KV</td></tr><tr><td>草稿内可见性</td><td>因果位置约束</td><td>所有 5 个草稿位置互相可见（块内双向）</td></tr><tr><td>Global 分支</td><td>L2–39 使用 CSA2</td><td>compress_ratio=0；无 Compressor / Global / Indexer</td></tr><tr><td>共同结构</td><td colspan="2">低秩 Q、RMSNorm、尾部 RoPE、sink、Inverse RoPE、8 组输出投影</td></tr></table><p class="ds-note">当前草稿 KV 仅参与本次拼接；代码只把 main_x KV 写入持久环形窗口。Decode 中此参考实现要求单 token main_x（用 squeeze(1) 写一槽）；不能据此声称它已支持完整多 token 验证后的缓存推进 / 回滚。</p>`,
  heads:()=>`<h2>共享 LM Head + 轻量顺序 Markov Head + Confidence Head</h2><div class="ds-cards"><section class="ds-card"><h3>1 · 5 组 base logits 并行产生</h3>${chain([op(`Block 3 四路输出 → HC Pre<br>H₃ [1,${b},${h}]`,'draft'),op('最终 RMSNorm','norm'),op(`共享主模型 LM Head [${h},${v}]<br>base logits [1,${b},${v}]`)])}<p>没有为每个位置再跑一遍 Transformer。主模型与草稿共用 Token Embedding、LM Head 权重。</p></section><section class="ds-card"><h3>2 · Markov 串行补充相邻 token 依赖</h3>${chain([op(`前一 token tᵢ → 独立 Markov Embedding<br>表 [${v},${r}] → eᵢ [1,${r}]`),op(`eᵢ × Markov Head [${r},${v}]<br>biasᵢ [1,${v}]`),op('base_logitsᵢ + biasᵢ → sample → tᵢ₊₁','draft')])}<p>只依赖紧邻的前一 token。首步前驱为锚点 t₀，此后为刚采样的候选；这 5 步是轻量串行 Head，不是 5 次完整草稿网络。</p></section><section class="ds-card"><h3>3 · 置信度辅助调度，不直接接受 token</h3>${chain([op(`未最终 RMSNorm 的 H₃ [1,${b},${h}]<br>与各步 Markov eᵢ [1,${b},${r}] 拼接`),op(`[1,${b},${h+r}] × W_conf [${h+r},1]<br>→ confidence 原始分数 [1,${b}]`),op('论文：Sigmoid / 校准 → 条件接受概率<br>→ 前缀生存率 → 调度器','cache')])}<p class="ds-note">官方 forward_head 返回线性分数，未执行 sigmoid 或 STS 校准。不能把返回的 raw scores 直接写成已校准的接受概率。</p></section></div><div class="ds-controls"><button id="ds-markov-prev">← 前一步</button><strong id="ds-markov-step"></strong><button id="ds-markov-next">后一步 →</button></div><div id="ds-markov-view" class="ds-op draft"></div><p><code>output_ids=[t₀,c₁,c₂,c₃,c₄,c₅]</code> 的形状是 [1,6]；包含旧锚点 + 5 个新候选，不是生成 6 个新 token。返回 logits 为加过 Markov bias 的 [1,5,129280]，confidence 为 [1,5]。</p>`,
  prefill:()=>`<h2>Prefill 与 Decode 执行的内容不同</h2><table class="ds-table"><tr><th>阶段</th><th>Prefill · start_pos=0</th><th>Decode 草稿调用 · start_pos&gt;0</th></tr><tr><td>主干条件</td><td>目标三层的整段隐藏状态 → Concat / Projection / RMSNorm</td><td>当前一个 token 的三层隐藏状态 → 同样的条件投影</td></tr><tr><td>每个 Draft Block</td><td>只调用 Attention 的上下文 KV 投影、Norm、RoPE、量化，填充窗口缓存；直接返回原草稿 x / pre_mix</td><td>执行 HC / Norm / Draft Attention / HC / FFN / HC 完整 Block</td></tr><tr><td>Q、草稿 KV、MoE</td><td>跳过</td><td>执行；五个位置一起计算</td></tr><tr><td>Draft Head</td><td>跳过</td><td>LM Head 并行 logits + 5 次轻量 Markov 采样 + Confidence</td></tr><tr><td>forward_spec 返回</td><td>None，不产生候选</td><td>output_ids [1,6]、logits [1,5,129280]、raw confidence [1,5]</td></tr></table><p class="ds-note">forward_embed 在两种调用中都会建立五位置草稿输入；Prefill 时这不表示执行了五位置草稿生成。推测验证后的多 token 缓存推进和回滚属于此参考文件未提供的调度循环。</p>`,
  dimensions:()=>`<h2>一个主模型 token 作为条件 / 锚点时的逻辑矩阵维度</h2><p>B=1；条件序列 S=1；P=${b} 是草稿位置数；D=${h} 是隐藏宽度；V=${v} 是词表大小；r=${r} 是 Markov 低秩宽度。以下采用行向量数学权重，PyTorch Linear 的存储权重轴相反。</p><table class="ds-table"><tr><th>模块 / 用途</th><th>输入 × 权重 = 输出</th></tr>${[
  ['主干三层条件拼接',`3 × [1,1,${hc},${h}] → 每层 mean(4 路) → Concat [1,1,${concat}]`],
  ['main_proj / main_norm',`[1,${concat}] × [${concat},${h}] = [1,${h}] → RMSNorm`],
  ['Token Embedding',`[t₀,n,n,n,n] 查共享表 [${v},${h}] → [1,${b},${h}] → [1,${b},${hc},${h}]`],
  ['Q 左 / 右投影（每个 Draft 位置）',`[1,${h}] × [${h},${q}] = [1,${q}] → RMSNorm；[1,${q}] × [${q},${a*k}] = [1,${a*k}] → [1,${a},${k}]`],
  ['上下文 / 草稿 KV（各自每个位置）',`[1,${h}] × [${h},${k}] = [1,${k}] → RMSNorm / RoPE；同一 Draft 层两者使用同一个 W_KV`],
  ['分组输出投影（每个位置）',`${groups} 组：[1,${a*k/groups}] × [${a*k/groups},${orank}] = [1,${orank}]；拼接 [1,${groups*orank}] × [${groups*orank},${h}] = [1,${h}]`],
  ['MoE 单专家（每个位置）',`Gate / Up 各 [1,${h}] × [${h},${c.moe_inter_dim}] = [1,${c.moe_inter_dim}]；SwiGLU → Down × [${c.moe_inter_dim},${h}] = [1,${h}]`],
  ['共享 LM Head（五位置并行）',`[${b},${h}] × [${h},${v}] = [${b},${v}]，加回 Batch → [1,${b},${v}]`],
  ['Markov Head（每个采样步骤）',`前一 token 查独立表 [${v},${r}] → [1,${r}] × [${r},${v}] = bias [1,${v}]`],
  ['Confidence（每个位置）',`Concat [1,${h}] + [1,${r}] = [1,${h+r}]；× [${h+r},1] = [1,1]；五位置合成 [1,${b}]`]
 ].map(([label,shape])=>`<tr><td>${label}</td><td><code>${shape}</code></td></tr>`).join('')}</table>`,
  verification:()=>`<h2>候选先调度，再由主模型验证；只有接受结果进入输出</h2><div class="ds-cards"><section class="ds-card"><h3>论文 §3.2 · Confidence scheduling</h3><p>将 raw score 转为经校准的条件接受概率 aᵢ，前缀生存率为 <code>sⱼ=∏ᵢ₌₁ʲ aᵢ</code>。调度器结合实际引擎的负载 / SPS 曲线，为各请求选择前缀 m∈[0,5]。</p><p>论文调度器按前缀收益贪心接纳，吞吐收益不再增加时提前停止，以保持接纳决策的因果性。这里没有用一个固定置信度阈值代替该算法。</p></section><section class="ds-card"><h3>论文 §2.1 · 主模型验证</h3><p>将锚点加选定前缀 <code>[t₀,c₁…cₘ]</code> 送给同一主模型，以因果掩码一次计算目标分布 pᵢ。对候选 cᵢ，按 <code>min(1,pᵢ(cᵢ)/qᵢ(cᵢ))</code> 接受，其中 qᵢ 是加 Markov bias 后的草稿采样分布。</p><p>从左到右接受连续前缀，首次拒绝后丢弃余下草稿；拒绝点按纠正分布补 token，全部接受时可由主模型补充下一 token。Confidence 仅决定验证预算，不能替代这个接受规则。</p></section><section class="ds-card"><h3>为何减少串行计算？</h3><p>普通 AR 为多个输出 token 逐个运行完整主干；DSpark 的 3 层草稿网络一次处理 5 个位置，仅 Markov Head 做轻量逐步采样，再把选定前缀交给主模型一次验证。</p><p>当多个候选被接受，一轮提交多个 token，减少大模型串行调用轮数。实际收益取决于接受率、负载及实现，没有保证每轮接受 5 个。</p></section></div><p class="ds-note">model.py 只返回草稿 IDs / logits / raw confidence。概率转换与校准、吞吐调度、主模型多位置验证、拒绝采样纠正及缓存提交 / 回滚循环均未在 forward_spec() 中实现；绿色路径是论文流程说明。</p><div class="ds-controls"><label>送验候选数 m <input id="ds-verify-length" type="range" min="0" max="5" value="4"></label><label>示意接受前缀长度 <input id="ds-accept-length" type="range" min="0" max="4" value="2"></label></div><div id="ds-verification-demo"></div><p class="ds-flow-label">颜色演示由手动选择控制，不运行模型或模拟真实随机接受概率。锚点 t₀ 已来自主模型，不属于五个待验证候选。</p>`
 };
 const names={inputs:'输入与五个位置',blocks:'3 个 Draft Blocks',attention:'Draft Attention',heads:'三个 Head',prefill:'Prefill / Decode',dimensions:'矩阵维度',verification:'验证与接受'};
 function render(which=tab){tab=names[which]?which:'inputs';content.innerHTML=views[tab]()+source;tabs.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.dsTab===tab));b.tabIndex=b.dataset.dsTab===tab?0:-1;});dialog.scrollTop=0;
  if(tab==='heads'){
   const update=()=>{content.querySelector('#ds-markov-step').textContent=`轻量采样第 ${markovPosition} / 5 步`;content.querySelector('#ds-markov-view').textContent=`前一 token ${markovPosition===1?'t₀':'c'+(markovPosition-1)} → Markov Embedding [1,256] → bias [1,129280] + base_logits[${markovPosition-1}] → sample c${markovPosition}`;content.querySelector('#ds-markov-prev').disabled=markovPosition===1;content.querySelector('#ds-markov-next').disabled=markovPosition===b;};
   content.querySelector('#ds-markov-prev').onclick=()=>{markovPosition--;update();};content.querySelector('#ds-markov-next').onclick=()=>{markovPosition++;update();};update();
  }
  if(tab==='verification'){
   const length=content.querySelector('#ds-verify-length'),accept=content.querySelector('#ds-accept-length'),output=content.querySelector('#ds-verification-demo');
   const update=()=>{const m=Number(length.value);accept.max=m;accept.value=Math.min(Number(accept.value),m);const n=Number(accept.value);output.innerHTML='<div class="ds-positions">'+Array.from({length:b},(_,i)=>`<span class="ds-position ${i>=m?'omitted':i<n?'accepted':i===n?'rejected':''}">c${i+1} · ${i>=m?'未送验':i<n?'接受':i===n?'拒绝':'丢弃'}</span>`).join('')+`</div><div class="ds-op norm">最终提交：${n?Array.from({length:n},(_,i)=>'c'+(i+1)).join(' → ')+' → ':''}主模型${n<m?'纠正':'补充'} token；${5-m} 个候选未送验</div>`;};length.oninput=update;accept.oninput=update;update();
  }
 }
 for(const [key,name] of Object.entries(names)){const button=document.createElement('button');button.textContent=name;button.dataset.dsTab=key;button.setAttribute('role','tab');button.onclick=()=>render(key);tabs.append(button);}
 function hide(restore=true){if(!active)return;active=false;overview.style.display='none';document.body.classList.remove('dspark-on');launch.setAttribute('aria-pressed','false');if(restore&&savedView){view={...savedView};region.value=savedRegion;paint();}}
 function show(){window.dispatchEvent(new CustomEvent('architecture-detail-open',{detail:{name:'dspark'}}));if(window.informationFlow?.state.enabled)document.getElementById('flow-toggle').click();if(!active){savedView={...view};savedRegion=region.value==='dspark'?'all':region.value;}closePanel();active=true;overview.style.display='';document.body.classList.add('dspark-on');launch.setAttribute('aria-pressed','true');region.value='dspark';view={x:0,y:0,w:1672,h:941};paint();fitLabels();}
 function detail(which){closePanel();render(which);dialog.showModal();}
 document.getElementById('ds-close').onclick=()=>dialog.close();launch.onclick=()=>active?hide():show();
 function activate(e){if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;const node=e.target.closest('#dspark-overview .dspark-node');if(!node)return;e.preventDefault();e.stopImmediatePropagation();if(dragged){dragged=false;return;}detail(node.closest('[data-dspark-stage]').dataset.dsparkStage);}
 svg.addEventListener('click',activate,true);svg.addEventListener('keydown',activate,true);
 document.addEventListener('change',e=>{if(e.target!==region)return;if(region.value==='dspark'){e.stopPropagation();show();}else hide(false);},true);
 window.addEventListener('architecture-detail-open',e=>{if(e.detail.name!=='dspark')hide(false);});
 document.getElementById('flow-toggle').addEventListener('click',()=>hide(),true);document.getElementById('reset').addEventListener('click',()=>hide(false),true);
 document.addEventListener('keydown',e=>{if(e.key==='0'&&!dialog.open&&!/INPUT|SELECT/.test(e.target.tagName))hide(false);});
 tabs.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(names),i=keys.indexOf(tab),j=e.key==='Home'?0:e.key==='End'?keys.length-1:(i+(e.key==='ArrowLeft'?-1:1)+keys.length)%keys.length;render(keys[j]);tabs.children[j].focus();}});
 window.dsparkArchitecture={get state(){return{active,tab,dialogOpen:dialog.open,config:{layers:c.n_mtp_layers,positions:b,targets:c.dspark_target_layer_ids}}},show,hide,detail};
 // Default overview includes both paths. Existing detailed architecture remains one selection away.
 if(location.hash!=='#architecture')show();
})();
</script>
