<style>
.csa2-hidden{display:none}
.csa2-module{cursor:pointer;outline:none}.csa2-module text{pointer-events:none}.csa2-module:hover>.surface,.csa2-module:focus-visible>.surface{stroke:#245dc3;stroke-width:1.8;filter:drop-shadow(0 1px 2px #1c479a24)}.csa2-module.selected>.surface{stroke:#1d57c7;stroke-width:2.5;filter:drop-shadow(0 0 3px #386bd945)}
.csa2-on #diagram-content,.csa2-on #indexer-entry-links{display:none}.csa2-on #stage{top:var(--csa2-stage-top,125px)}
#csa2-bar[hidden]{display:none!important}#csa2-bar{position:absolute;z-index:4;left:10px;right:10px;top:var(--header-height,66px);border:1px solid #f3c2d9;border-radius:0 0 7px 7px;background:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.csa2-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#csa2-bar strong{font-size:15px;color:#7a1f4e}#csa2-bar span{color:#60738f}
.csa2-controls button{font-size:12px;padding:4px 9px}.csa2-controls button[aria-pressed=true]{background:#ffeaf2;border-color:#D15C88;color:#7a1f4e}
#csa2-close,#csa2-indexer{margin-left:auto;font-size:12px;padding:5px 9px}
@media(max-width:780px){#csa2-bar{left:5px;right:5px;padding:6px 9px;gap:5px}#csa2-bar strong{font-size:13px}#csa2-bar span{display:none}}
</style>
<template id="csa2-svg-template"><svg xmlns="http://www.w3.org/2000/svg">__CSA2_SVG__</svg></template>
<section id="csa2-bar" hidden aria-label="CSA2 展示控制">
 <div class="csa2-controls"><strong>CSA2 Detail</strong>
  <button data-csa2-mode="full" aria-pressed="true">Full</button>
  <button data-csa2-mode="reindex" aria-pressed="false">Reindex</button>
  <button data-csa2-mode="reuse" aria-pressed="false">Reuse</button></div>
 <span>Branch C 会随模式变化；Branch A / B 每层都一样。</span>
 <button id="csa2-indexer">打开 Indexer / Compressor 完整流程 →</button>
 <button id="csa2-close">返回架构 ×</button>
</section>
<script>
(()=>{
 const template=document.getElementById('csa2-svg-template');
 for(const child of [...template.content.querySelector('svg').children])svg.append(child.cloneNode(true));template.remove();
 const detail=document.getElementById('csa2-detail'),bar=document.getElementById('csa2-bar'),region=document.getElementById('region-select');
 const option=document.createElement('option');option.value='csa2';option.textContent='F · CSA2 Detail';region.append(option);regions.csa2=[15,12,1642,1030];
 let active=false,mode='full',savedView=null,savedRegion='all';
 const oldOpen=openPanel;openPanel=function(...args){svg.querySelectorAll('.csa2-module.selected').forEach(n=>n.classList.remove('selected'));return oldOpen(...args);};
 const oldClose=closePanel;closePanel=function(...args){svg.querySelectorAll('.csa2-module.selected').forEach(n=>n.classList.remove('selected'));return oldClose(...args);};
 function activateModule(e){
  if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;
  const m=e.target.closest('.csa2-module');if(!m)return;
  e.preventDefault();e.stopImmediatePropagation();if(dragged){dragged=false;return;}
  openPanel(m.dataset.module,m);
 }
 svg.addEventListener('click',activateModule,true);svg.addEventListener('keydown',activateModule,true);
 function fitBar(){if(active)document.documentElement.style.setProperty('--csa2-stage-top',(bar.getBoundingClientRect().bottom+8)+'px');}
 function render(){
  for(const b of bar.querySelectorAll('[data-csa2-mode]'))b.setAttribute('aria-pressed',String(b.dataset.csa2Mode===mode));
  detail.querySelectorAll('[data-csa2-mode]').forEach(g=>g.classList.toggle('csa2-hidden',g.dataset.csa2Mode!==mode));
  fitBar();
 }
 function show(m='full'){
  window.dispatchEvent(new CustomEvent('architecture-detail-open',{detail:{name:'csa2'}}));
  if(window.informationFlow?.state.enabled)document.getElementById('flow-toggle').click();
  if(!active){savedView={...view};savedRegion=region.value==='csa2'?'all':region.value;}
  closePanel();active=true;mode=m;detail.style.display='';bar.hidden=false;document.body.classList.add('csa2-on');
  region.value='csa2';view={x:0,y:0,w:1672,h:1050};paint();render();fitLabels();
 }
 function hide(restore=true,preserveSelection=false){
  if(!active)return;
  if(!preserveSelection)closePanel();active=false;detail.style.display='none';bar.hidden=true;document.body.classList.remove('csa2-on');
  if(restore&&savedView){view={...savedView};region.value=savedRegion;paint();}
 }
 const oldDraw=drawPanel;drawPanel=function(...args){
  oldDraw(...args);
  if(['query','localstates','sparse','multi','compressor','indexer','global','output','sliding'].includes(selected)){
   const b=document.createElement('button');b.className='indexer-launch';b.textContent=active?'定位 CSA2 完整流程 →':'展开 CSA2 完整流程 →';b.addEventListener('click',()=>show(mode));body.prepend(b);
  }
  const flowEntry=body.querySelector('.flow-entry');if(active&&flowEntry)flowEntry.addEventListener('click',()=>hide(true,true),true);
 };
 for(const b of bar.querySelectorAll('[data-csa2-mode]'))b.addEventListener('click',()=>{mode=b.dataset.csa2Mode;closePanel();render();});
 document.getElementById('csa2-indexer').addEventListener('click',()=>{hide(false);region.value='indexer';region.dispatchEvent(new Event('change',{bubbles:true}));});
 document.getElementById('csa2-close').addEventListener('click',()=>hide());
 region.addEventListener('change',e=>{if(e.target.value==='csa2'){e.stopPropagation();show();}else if(active)hide(false);},true);
 document.getElementById('reset').addEventListener('click',()=>hide(false),true);
 document.getElementById('flow-toggle').addEventListener('click',()=>hide(),true);
 document.addEventListener('keydown',e=>{if(e.key==='0'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))hide(false);if(e.key==='Escape'&&active&&panel.getAttribute('aria-hidden')==='true')hide();},true);
 svg.addEventListener('dblclick',e=>{if(active&&!e.target.closest('.module')&&!e.target.closest('.csa2-module')){hide();e.stopImmediatePropagation();}},true);
 window.addEventListener('architecture-detail-open',e=>{if(e.detail?.name!=='csa2')hide();});
 new ResizeObserver(fitBar).observe(bar);window.addEventListener('resize',fitBar);
 render();fitLabels();
 window.csa2Teaching={show,hide,get state(){return{active,mode};}};
})();
</script>
