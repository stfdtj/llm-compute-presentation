<style>
.hc-module{cursor:pointer;outline:none}.hc-module text{pointer-events:none}.hc-module:hover>.surface,.hc-module:focus-visible>.surface,.hc-module.selected>.surface{stroke:#245dc3;stroke-width:2;filter:drop-shadow(0 1px 2px #1c479a24)}
.hc-on #diagram-content,.hc-on #indexer-entry-links{display:none}.hc-on #stage{top:var(--hc-stage-top,125px)}
#hc-bar[hidden]{display:none!important}#hc-bar{position:absolute;z-index:4;left:10px;right:10px;top:var(--header-height,66px);border:1px solid #dae3f1;border-radius:0 0 7px 7px;background:#fff;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
#hc-bar strong{font-size:15px;color:#080d59}#hc-bar span{color:#60738f}#hc-close{margin-left:auto;font-size:12px;padding:5px 9px}.hc-launch{font-size:12px;margin:0 0 10px}
@media(max-width:780px){#hc-bar{left:5px;right:5px;padding:6px 9px;gap:5px}#hc-bar strong{font-size:13px}#hc-bar span{font-size:10px}}
</style>
<template id="hc-svg-template"><svg xmlns="http://www.w3.org/2000/svg">__HC_SVG__</svg></template>
<section id="hc-bar" hidden aria-label="HC Detail 展示控制"><strong>HC Detail · Pre / Post / Comb</strong><span>点击节点，定位已有 HC 计算步骤；点击空白关闭计算面板。</span><button id="hc-close">返回架构 ×</button></section>
<script>
(()=>{
 const template=document.getElementById('hc-svg-template');
 for(const child of [...template.content.querySelector('svg').children])svg.append(child.cloneNode(true));template.remove();
 const detail=document.getElementById('hc-detail'),bar=document.getElementById('hc-bar'),region=document.getElementById('region-select');
 const option=document.createElement('option');option.value='hc';option.textContent='F · HC Detail';region.append(option);regions.hc=[15,12,1642,916];
 let active=false,savedView=null,savedRegion='all',lastRegion=region.value,stage='all';
 function fitBar(){if(active)document.documentElement.style.setProperty('--hc-stage-top',(bar.getBoundingClientRect().bottom+8)+'px');}
 function show(){
  window.dispatchEvent(new CustomEvent('architecture-detail-open',{detail:{name:'hc'}}));
  if(window.informationFlow?.state.enabled)document.getElementById('flow-toggle').click();
  if(!active){savedView={...view};savedRegion=region.value==='hc'?lastRegion:region.value;}
  closePanel();active=true;detail.style.display='';bar.hidden=false;document.body.classList.add('hc-on');
  svg.querySelectorAll('[data-hc-expand]').forEach(n=>n.setAttribute('aria-expanded','true'));
  region.value='hc';view={x:0,y:0,w:1672,h:941};paint();fitBar();fitLabels();
 }
 function hide(restore=true,preserveSelection=false){
  if(!active)return;
  if(!preserveSelection)closePanel();active=false;detail.style.display='none';bar.hidden=true;document.body.classList.remove('hc-on');
  svg.querySelectorAll('[data-hc-expand]').forEach(n=>n.setAttribute('aria-expanded','false'));
  if(restore&&savedView){view={...savedView};region.value=savedRegion;lastRegion=savedRegion;paint();}
 }
 // Resolve stage names against the canonical HC ledger; no copied equations/counts.
 function stepFor(which){
  const steps=DATA.hc[mode].steps;
  const forward={flatten:'1a ·',projection:'W_HC',transform:'2a ·',prenext:'2b ·',pre:'3 ·',submodule:'3 ·',post:'4 ·',comb:'4 ·',update:'4 ·',streams:'3 ·'};
  const backward={flatten:'1a⁻¹',projection:'W_HC · dW',transform:'2a⁻¹',prenext:'2b⁻¹',pre:'3⁻¹ · pre 合并的输入',submodule:'4⁻¹ · 子模块输出',post:'4⁻¹ · post',comb:'4⁻¹ · comb',update:'汇总',streams:'汇总'};
  const needle=(mode==='backward'?backward:forward)[which];
  return Math.max(0,needle?steps.findIndex(s=>s.title.includes(needle)):0);
 }
 function locate(which,element){
  if(mode==='parameter')document.querySelector('[data-mode="forward"]').click();
  stage=which;openPanel('hc',element);
  if(which==='all')return;
  const index=stepFor(which),target=body.querySelector('[data-derivation-index="'+index+'"]');
  if(target){body.querySelectorAll('.derivation-step').forEach(n=>n.open=n===target);window.parameterAudit.selectStep(index);target.scrollIntoView({block:'start',behavior:'instant'});}
 }
 const oldOpen=openPanel;openPanel=function(...args){svg.querySelectorAll('.hc-module.selected').forEach(n=>n.classList.remove('selected'));return oldOpen(...args);};
 const oldClose=closePanel;closePanel=function(...args){svg.querySelectorAll('.hc-module.selected').forEach(n=>n.classList.remove('selected'));return oldClose(...args);};
 const oldDraw=drawPanel;drawPanel=function(...args){
  oldDraw(...args);
  if(selected==='hc'){
   const launch=document.createElement('button');launch.className='hc-launch';launch.textContent=active?'显示 HC 完整架构 →':'展开 HC Pre / Post / Comb 架构 →';
   launch.addEventListener('click',show);body.prepend(launch);
  }
  const flowEntry=body.querySelector('.flow-entry');if(active&&flowEntry)flowEntry.addEventListener('click',()=>hide(true,true),true);
 };
 function activate(e){
  if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;
  const node=e.target.closest('.hc-module');if(!node)return;
  e.preventDefault();e.stopImmediatePropagation();if(dragged){dragged=false;return;}
  if(node.hasAttribute('data-hc-expand'))show();else locate(node.dataset.hcStage,node);
 }
 svg.addEventListener('click',activate,true);svg.addEventListener('keydown',activate,true);
 // Capture region transitions before the existing Indexer/main focus listeners.
 document.addEventListener('change',e=>{
  if(e.target!==region)return;
  if(region.value==='hc'){e.stopPropagation();show();}
  else{if(active)hide(false);lastRegion=region.value;}
 },true);
 document.getElementById('hc-close').addEventListener('click',()=>hide());
 document.getElementById('reset').addEventListener('click',()=>{hide(false);lastRegion='all';},true);
 document.getElementById('flow-toggle').addEventListener('click',()=>hide(),true);
 document.addEventListener('keydown',e=>{
  if(e.key==='0'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){hide(false);lastRegion='all';}
  if(e.key==='Escape'&&active&&panel.getAttribute('aria-hidden')==='true')hide();
 },true);
 svg.addEventListener('dblclick',e=>{if(active&&!e.target.closest('.hc-module')){hide();e.stopImmediatePropagation();}},true);
 window.addEventListener('architecture-detail-open',e=>{if(e.detail?.name!=='hc')hide();});
 new ResizeObserver(fitBar).observe(bar);window.addEventListener('resize',fitBar);
 window.hcTeaching={show,hide,get state(){return{active,stage};}};
 fitLabels();
})();
</script>
