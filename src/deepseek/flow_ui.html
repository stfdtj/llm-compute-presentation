hot>.hit-label{stroke:var(--flow-color,#326ac2);stroke-width:2.3}.flow-on #diagram-content>.connection{opacity:.12}.flow-on #diagram-content>.flow-obsolete{visibility:hidden}.flow-overlay{display:none;pointer-events:none}.flow-on .flow-overlay{display:block}.flow-path{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;pointer-events:stroke}.flow-path.dashed{stroke-dasharray:8 5;animation:flow-dash 2.4s linear infinite}.flow-dot{pointer-events:none}.flow-arrow-hit{fill:none;stroke:transparent;stroke-width:13;pointer-events:stroke;cursor:help}.flow-svg-label{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round;fill:#28548b}.flow-aux{pointer-events:all;cursor:pointer}.flow-aux text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;pointer-events:none}.flow-tag{font-size:11px;color:#667991;background:#f0f5fb;border-radius:4px;padding:5px 8px;margin:10px 0}.flow-card{padding:12px;border:1px solid #dde6f3;border-radius:8px;margin:12px 0;background:#f9fbff}.flow-card h3{font-size:13px;margin:0 0 7px}.flow-card p{font-size:13px;line-height:1.8;margin:5px 0}.flow-matrix{font:16px/1.8 'Cambria Math','Microsoft YaHei',serif;color:#245c9b;overflow-wrap:anywhere}.flow-detail-links{display:flex;gap:7px;flex-wrap:wrap}.flow-detail-links button{font-size:12px}.flow-tooltip{display:none;position:fixed;z-index:20;max-width:310px;background:#173051;color:white;border-radius:7px;padding:9px 12px;font-size:12px;line-height:1.7;pointer-events:none;box-shadow:0 4px 15px #16325022}.flow-on #inspector{top:calc(var(--flow-stage-top,225px) + 8px);max-height:calc(100dvh - var(--flow-stage-top,225px) - 48px)}.flow-on .stage{top:var(--flow-stage-top,225px)}.flow-source{font-size:12px;line-height:1.8;color:#64748b}.flow-pick[aria-pressed=true]{border-color:currentColor;background:#f3f7fc;box-shadow:inset 0 -2px currentColor}.flow-mobile-close{display:none}@keyframes flow-dash{to{stroke-dashoffset:-26}}@media(max-width:1450px){.flow-legend{gap:7px}.flow-top{gap:8px}.flow-title{font-size:13px}header{gap:9px}.scenario{display:none}}@media(max-width:1000px){.flow-top{flex-wrap:wrap}.flow-legend{margin-left:0}.flow-bottom{gap:7px}.flow-controls button{font-size:11px}.flow-caches{flex-wrap:wrap}.flow-title{flex:1}}@media(max-width:780px){#flow-toggle{font-size:11px;padding:5px}.flow-bar{top:105px;left:5px;right:5px;padding:8px}.flow-legend{display:none}.flow-top{gap:5px}.flow-title{font-size:12px}.flow-bottom{display:block;margin-top:6px;min-height:0}.flow-message p{font-size:11px}.flow-equation{font-size:12px}.flow-facts{font-size:10px}.flow-actions{margin-top:5px}.flow-controls{gap:3px}.flow-controls button{padding:4px}.flow-on #inspector{top:auto;bottom:31px;max-height:44dvh;right:10px!important;width:calc(100vw - 20px)}.flow-on .panel-head{padding:10px 14px}.flow-on .panel-head h1{font-size:15px}.flow-on .panel-body{padding:12px}.flow-on .scope{display:none}.flow-caches{gap:4px}.cache-row{font-size:10px;padding:2px 4px}.flow-chip{font-size:10px;padding:3px 5px}.flow-tooltip{max-width:240px}}@media(prefers-reduced-motion:reduce){.flow-path{animation:none!important}.flow-dot{display:none}}

<section id="flow-bar" class="flow-bar" aria-label="信息流分步演示">
 <div class="flow-top"><div class="flow-controls"><button id="flow-prev">上一步</button><span id="flow-counter" aria-live="polite">1/5</span><button id="flow-next">下一步</button><button id="flow-replay">重新播放</button></div><h2 id="flow-title" class="flow-title"></h2><div class="flow-legend"><span><i style="color:#2863c5"></i>Hidden State →</span><span><i class="dashed" style="color:#cb7916"></i>Global KV →</span><span><i class="dashed" style="color:#22936b"></i>Local KV →</span><span><i style="color:#8a4ec2"></i>Attention →</span></div></div>
 <div class="flow-bottom"><div class="flow-message"><div id="flow-equation" class="flow-equation"></div><p id="flow-description"></p><div id="flow-facts" class="flow-facts"></div></div><div id="flow-visual"></div><div class="flow-actions"><button id="flow-focus">定位这一步</button><button id="flow-explain">展开说明</button></div></div>
</section><div id="flow-tooltip" class="flow-tooltip" role="tooltip"></div>
<script>
(()=>{
 const colors={hidden:'#2863c5',global:'#cb7916',local:'#22936b',attention:'#8a4ec2'};
 const steps=[
 {title:'1 · Encoder 更新当前 token',equation:'[1,5120] → 20 Encoder Layers → [1,5120]',desc:'蓝色主干继续进入 Decoder；橙色分支另存 KV，供注意力读取。',fact:'图中单行是教学概括；源码跨层保留 [1,4,5120]，进入 Attention 前经 HC 合并与 RMSNorm。',keys:['input','tokenizer','ids','embedding','encoder','hidden','decoder'],main:'hidden',panel:'Hidden State 是当前 token 的特征，不是缓存地址。Encoder 每层更新这份状态，随后层 20 继续处理同一个 token。'},
 {title:'2 · 分支生成 Global KV',equation:'C = H_enc × W_KV　　[1,5120] × [5120,512] = [1,512]',desc:'5120 个特征经学习矩阵组合成 512 个数字，再归一化、旋转并写入缓存。',fact:'源码：layer 20 的 Compressor，ratio=1；H_enc 在此表示经过 HC 合并与 Attention 输入归一化后的向量。',keys:['hidden','global','decoder','layer20'],main:'global',panel:'W_KV 是 [5120,512] 的可学习矩阵，C 是投影结果。随后 RMSNorm → 尾部 64 维 RoPE → FP4 数值量化 → 缓存写入。跨层 Hidden State 同时沿蓝色路径继续，512 维 KV 不替代它。'},
 {title:'3 · 将一行写入 KV Cache',equation:'当前 KV [1,512] → 缓存 [S,512] → 后续 Attention 读取',desc:'每一行保存一个可读取位置的特征。点击“写入下一行”，观察缓存增长。',fact:'3 行是无压缩的教学例子；一般 S 受分组策略影响。当前配置的 layer 20 为 ratio=1，层 20–39 复用其缓存。',keys:['global','decoder','layer20','layer39'],main:'global',panel:'缓存是运行时数据，不是新模型层。ratio=1 每个 token 产生一行；ratio=2 要凑齐一对才新增一行。因此一般情况下，S 不一定等于原始 token 数。后续层读取同一共享缓存，但仍计算各自的 Query、Local KV 和 Attention。'},
 {title:'4 · Query 读取两种 KV',equation:'当前 Query + 选中的 Global KV + Local KV → Attention 汇总',desc:'点击 Q / Global / Local 分别追踪三条输入；它们在 Multi-Source Attention 汇合。',fact:'源码：两种 KV 在位置维拼接，一次 sparse_attn 共同归一化；64 个 Query Head 读取共享的 512 维 KV，不把缓存复制成 64 份。',keys:['streams','query','qa','qnorm','qb','hidden','global','localstates','multi'],main:'multi',panel:'Query 来自当前 Decoder 层自己的 Attention 输入：W_QA → RMSNorm → W_QB → 尾部 RoPE，得到 [1,64,512]。Global KV 由 layer 20 生成并跨层复用。Local KV 则由每层自己的投影、归一化与 RoPE 产生，写入最多 128 个位置的环形缓存。'},
 {title:'5 · 汇总结果回到 Hidden State',equation:'Attention → 输出投影 [1,5120] → HC / MoE → Final RMSNorm → LM Head',desc:'注意力读取缓存后，用得到的信息更新当前 token 的状态，最终给下一个 token 打分。',fact:'源码：逆 RoPE → 分组输出投影 → HC 更新四路状态；最终合并、归一化，输出 [1,129280] 个词表分数。',keys:['multi','output','decoder','decoderattn','hc','moe','finalnorm','head','logits','prediction'],main:'head',panel:'缓存提供上下文，Hidden State 负责继续计算。Attention 汇总先做逆 RoPE 和输出投影，回到 [1,5120]，再由 HC 混入四路残差，并经 FFN / MoE 更新。共享 KV 减少后续层重复生成这份全局表示的工作；并没有省掉后续层自己的 Query、Local KV 或 Attention。'}];
 const toggle=document.createElement('button');toggle.id='flow-toggle';toggle.textContent='信息流 / Data Flow';toggle.setAttribute('aria-pressed','false');document.querySelector('.modes').after(toggle);
 const bar=document.getElementById('flow-bar'),tip=document.getElementById('flow-tooltip');
 let enabled=false,index=0,written=1,filter='all',savedView=null;
 const ns='http://www.w3.org/2000/svg',overlay=document.createElementNS(ns,'g');overlay.classList.add('flow-overlay');overlay.setAttribute('aria-label','信息流辅助标注，并非新增模型层');svg.append(overlay);
 // Suppress only the misleading projection-to-decoder arrow while the overlay is on.
 const obsolete=[...svg.querySelectorAll('.connection')].filter(p=>p.getAttribute('d')==='M1063 233 H1070');obsolete.forEach(p=>p.classList.add('flow-obsolete'));
 function resize(){if(enabled)document.documentElement.style.setProperty('--flow-stage-top',(bar.getBoundingClientRect().bottom+9)+'px');}
 new ResizeObserver(resize).observe(bar);window.addEventListener('resize',resize);
 function node(tag,attrs={},text=''){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n;}
 function label(x,y,text,type='hidden'){overlay.append(node('text',{x,y,class:'flow-svg-label',style:'fill:'+colors[type]},text));}
 function tooltip(e,text){tip.textContent=text;tip.style.display='block';const r=e.target.getBoundingClientRect();const x=e.clientX||r.x,y=e.clientY||r.y;tip.style.left=Math.max(6,Math.min(innerWidth-tip.offsetWidth-8,x+12))+'px';tip.style.top=Math.max(6,Math.min(innerHeight-tip.offsetHeight-8,y+14))+'px';}
 function path(d,type,description){
  const g=node('g'),p=node('path',{d,class:'flow-path'+(['global','local'].includes(type)?' dashed':''),stroke:colors[type],'marker-end':`url(#flow-arrow-${type})`});g.append(p);
  const hit=node('path',{d,class:'flow-arrow-hit',tabindex:0,role:'img','aria-label':description});hit.append(node('title',{},description));hit.addEventListener('pointerenter',e=>tooltip(e,description));hit.addEventListener('pointerleave',()=>tip.style.display='none');hit.addEventListener('focus',e=>tooltip(e,description));hit.addEventListener('blur',()=>tip.style.display='none');g.append(hit);
  if(type==='hidden'||type==='attention'){const dot=node('circle',{r:3.5,fill:colors[type],class:'flow-dot'});dot.append(node('animateMotion',{dur:'4s',repeatCount:'indefinite',path:d}));g.append(dot);}overlay.append(g);
 }
 function auxiliary(x,y,w,h,title,sub){const g=node('g',{class:'flow-aux',tabindex:0,role:'button','aria-label':title+'：可视化辅助，不是新模型层'});g.append(node('rect',{x,y,width:w,height:h,rx:6,fill:'#fff6e7',stroke:colors.global,'stroke-dasharray':'4 3'}));g.append(node('text',{x:x+w/2,y:y+17,'text-anchor':'middle','font-size':12,fill:'#96580f'},title));g.append(node('text',{x:x+w/2,y:y+33,'text-anchor':'middle','font-size':10,fill:'#a16b29'},sub));g.addEventListener('click',e=>{e.stopPropagation();setStep(2);explain();});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();setStep(2);explain();}});overlay.append(g);}
 function draw(){
  overlay.replaceChildren();tip.style.display='none';const defs=node('defs');for(const [k,c]of Object.entries(colors)){const m=node('marker',{id:'flow-arrow-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto'});m.append(node('path',{d:'M0 0L10 5L0 10Z',fill:c}));defs.append(m);}overlay.append(defs);
  document.querySelectorAll('.flow-hot').forEach(n=>{n.classList.remove('flow-hot');n.style.removeProperty('--flow-color');});
  let keys=steps[index].keys;if(index===3&&filter!=='all')keys=filter==='hidden'?['streams','query','qa','qnorm','qb','multi']:filter==='global'?['hidden','global','multi']:['localstates','multi'];
  svg.querySelectorAll('.module').forEach(n=>{const b=n.getBBox();const inRegion=index===3?b.x>=453&&b.x<877&&b.y>=640:index<3?b.y<300:true;if(keys.includes(n.dataset.module)&&inRegion){n.classList.add('flow-hot');n.style.setProperty('--flow-color',colors[n.dataset.module==='global'?'global':n.dataset.module==='localstates'?'local':n.dataset.module==='multi'?'attention':'hidden']);}});
  if(index<3){
   if(index===0)for(const [a,b]of [[110,123],[213,223],[303,313]])path(`M${a} 232H${b}`,'hidden','当前 token 的文字、编号与词嵌入依次传到下一阶段；数值网络只跟踪当前这一行。');
   path('M441 232H508','hidden','当前 token 的词嵌入从输入侧进入 Encoder，更新它的特征。');path('M859 233H870','hidden','Encoder 更新后的状态沿主干继续传递。');
   path('M913 184V163H1186V184','hidden','Hidden State 从 Encoder 继续到 Decoder。蓝色主干绕过 KV 投影；源码在跨层处保留四路残差。');label(1098,157,'Hidden State 主干 · 5120 特征');
   if(index>0){path('M956 235H963','global','经 HC 合并与归一化的 layer 20 Attention 输入，分支送入 Compressor 的学习投影。');path('M1013 184V149','global','投影的 512 维向量经过 RMSNorm、尾部 RoPE 和量化后写入共享缓存。');label(879,176,'[1,5120]');auxiliary(947,94,154,55,'Global KV Cache',`[${index===2?written:'S'},512] · 辅助视图`);path('M1101 120H1274V184','global','共享缓存被 Decoder Attention 查询；不是替代 Decoder Hidden State 的直接输入。');label(1123,111,'读取 KV → Attention','global');}
  }
  if(index===3){
   const show=t=>filter==='all'||filter===t;
   if(show('hidden')){path('M526.5 701V704','hidden','W_Q(L) 输出 [1,1280]，串行送入 RMSNorm。');path('M526.5 725V728','hidden','归一化的低秩 Query 送入 W_Q(R)。');path('M526.5 749V752','hidden','展开为 64 个 Head 后，在尾部 64 维应用 RoPE。');path('M526.5 773V789','hidden','Q [1,64,512] 进入本层 Attention。');}
   if(show('global')){path('M794.5 773V789','global','L20 从经 HC Pre / RMSNorm 的 Encoder 最终状态生成 Global KV；L21–39 读取同一缓存，按本层模式选择或复用位置索引。');}
   if(show('local')){path('M660.5 701V704','local','本层 X 投影为 [1,512] 后经过 RMSNorm。');path('M660.5 725V728','local','Local KV 经尾部 RoPE 与 FP8 量化。');path('M660.5 749V752','local','写入本层独立的 128 槽 Local KV 环形缓存。');path('M660.5 773V789','local','Local KV 与 Global KV 同时参与 Attention。');}
   path('M664.5 818V823','attention','共同归一化与加权汇总的输出先经 Inverse RoPE。');path('M664.5 840V845','attention','执行分组 W_OA 与 W_OB，得到 U [1,5120]。');path('M664.5 870V875','attention','U 进入 HC，随后 MoE / HC 更新四路 Hidden State。');
  }
  if(index===4){path('M1197 277V350H1365V279','attention','Decoder 各层：Attention 输出经投影与 HC 更新状态，再经过 MoE。最终四路合并后进入 Final RMSNorm。');label(1142,364,'Hidden State 更新 → [1,5120]','attention');path('M1397 233H1407','hidden','最终归一化后的 [1,5120] 送入 LM Head。');path('M1479 233H1488','hidden','LM Head 产生 [1,129280] 个分数。');path('M1556 233H1566','hidden','根据当前 token 的词表分数预测下一个 token。');}
 }
 function visual(){const v=document.getElementById('flow-visual');v.replaceChildren();if(index===2){v.innerHTML=`<div class="flow-caches"><div class="cache-rows">${[1,2,3].map(n=>`<span class="cache-row ${n<=written?'written':''}">Token ${n}<br>[1,512]</span>`).join('')}</div><span class="flow-chip">→ [${written},512]</span><button id="flow-write" ${written===3?'disabled':''}>写入下一行</button></div>`;v.querySelector('button').addEventListener('click',()=>{written=Math.min(3,written+1);visual();draw();});}else if(index===3){v.innerHTML=`<div class="flow-actions">${[['all','三路汇合'],['hidden','Q'],['global','Global KV'],['local','Local KV']].map(([k,t])=>`<button class="flow-pick" data-flow-filter="${k}" aria-pressed="${filter===k}" style="color:${colors[k]||colors.attention}">${t}</button>`).join('')}</div>`;v.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.flowFilter;visual();draw();}));}}
 function focus(){svg.setAttribute('preserveAspectRatio',innerWidth<=780?'xMidYMin meet':'xMidYMid meet');if(index===3){view=innerWidth<=780?{x:448,y:625,w:433,h:316}:{x:438,y:578,w:455,h:371};}else if(innerWidth<=780){view=index===0?{x:310,y:145,w:652,h:205}:index===4?{x:1062,y:134,w:610,h:243}:{x:861,y:86,w:470,h:270};}else{view={x:0,y:75,w:1672,h:295};}paint();}
 function setStep(n,locate=true){index=Math.max(0,Math.min(4,n));filter='all';closePanel();const s=steps[index];document.getElementById('flow-title').textContent=s.title;document.getElementById('flow-equation').textContent=s.equation;document.getElementById('flow-description').textContent=s.desc;document.getElementById('flow-facts').textContent=s.fact;document.getElementById('flow-counter').textContent=(index+1)+'/5';document.getElementById('flow-prev').disabled=index===0;document.getElementById('flow-next').disabled=index===4;visual();draw();resize();if(locate)focus();}
 function activate(on){enabled=on;toggle.setAttribute('aria-pressed',String(on));document.body.classList.toggle('flow-on',on);closePanel();if(on){savedView={...view};written=1;setStep(0);}else{tip.style.display='none';svg.removeAttribute('preserveAspectRatio');svg.querySelectorAll('.flow-hot').forEach(n=>{n.classList.remove('flow-hot');n.style.removeProperty('--flow-color');});if(savedView){view={...savedView};paint();}overlay.replaceChildren();}}
 function explain(key=steps[index].main){
  const s=steps[index];openPanel(DATA[key]?key:s.main,svg.querySelector(`.module[data-module="${key}"]`));document.getElementById('panel-title').textContent=s.title;document.getElementById('panel-mode').textContent='信息流 / Information Flow';document.getElementById('panel-scope').textContent='当前 token · 原图上的辅助演示';
  body.innerHTML=`<div class="flow-card"><h3>从哪里来 → 送到哪里</h3><div class="flow-matrix">${esc(s.equation)}</div><p>${esc(s.panel)}</p></div>${index===3?`<div class="flow-card"><h3>先看单 Head 的基本原理 · 教学示意</h3><div class="flow-matrix">Q × Kᵀ → Scores<br>[1,512] × [512,N] = [1,N]<br>Softmax(Scores) × V → O<br>[1,N] × [N,512] = [1,512]</div><p>N 是实际读取的位置数，包含 Local 和选中的 Global 位置。Q 是当前 Head；K 用来匹配，V 用来汇总。ᵀ 表示转置。</p><p>完整实现还包含缩放、sink、索引筛选、量化与位置处理。同一 KV 向量同时用于 K 和 V，64 个 Query Head 共同读取它。</p></div>`:''}<div class="flow-tag">${esc(s.fact)}</div><div class="flow-detail-links"><button id="flow-to-calc">查看原计算说明</button><button id="flow-panel-next">${index===4?'回到第一步':'继续下一步'}</button></div><details class="extra"><summary>实现与教学示意的边界</summary><p class="flow-source">已核对本地 config.json、model.py 的 Block.forward、Compressor、Attention._window_kv / _compress_kv / forward，以及 kernel.py 的 sparse_attn。层 20 生成共享 KV，层 20–39 使用；Local KV 各层独立，窗口 128；当前配置 Query 为 64×512。</p><p class="flow-source">原图的 Encoder / Decoder 分段及 H_enc 单行是教学概括：实际没有独立的 Encoder 输出模块，跨层有四路残差，层 20 的 KV 分支取该层 HC 合并并归一化后的 Attention 输入。新增 Cache 框、三行缓存、移动点和基本 Softmax 公式是可视化辅助，不是新增层或运行中的真实张量。</p></details>`;
  body.querySelector('#flow-to-calc').addEventListener('click',()=>drawPanel());body.querySelector('#flow-panel-next').addEventListener('click',()=>setStep((index+1)%5));
 }
 const originalDraw=drawPanel;drawPanel=function(...args){originalDraw(...args);if(['global','hidden','multi','localstates'].includes(selected)){const b=document.createElement('button');b.className='flow-entry';b.textContent='沿信息流追踪这个模块 →';b.style.marginBottom='12px';b.addEventListener('click',()=>{const k=selected;if(!enabled)activate(true);setStep(k==='global'?1:k==='hidden'?0:3);});body.prepend(b);}};
 const keyStep={input:0,tokenizer:0,ids:0,embedding:0,encoder:0,hidden:0,global:1,compressor:1,decoder:3,decoderattn:3,query:3,qa:3,qb:3,qnorm:3,localstates:3,multi:3,finalnorm:4,head:4,logits:4,prediction:4,output:4};
 svg.addEventListener('click',e=>{if(!enabled||dragged)return;const m=e.target.closest('.module');if(!m)return;e.stopImmediatePropagation();const k=m.dataset.module;setStep(keyStep[k]??index,false);explain(k);},true);
 svg.addEventListener('keydown',e=>{if(!enabled||!['Enter',' '].includes(e.key))return;const m=e.target.closest('.module');if(!m)return;e.preventDefault();e.stopImmediatePropagation();setStep(keyStep[m.dataset.module]??index,false);explain(m.dataset.module);document.getElementById('close-panel').focus();},true);
 bar.addEventListener('click',e=>e.stopPropagation());toggle.addEventListener('click',e=>{e.stopPropagation();activate(!enabled);});
 document.getElementById('flow-prev').addEventListener('click',()=>setStep(index-1));document.getElementById('flow-next').addEventListener('click',()=>setStep(index+1));document.getElementById('flow-replay').addEventListener('click',()=>{written=1;setStep(0);});document.getElementById('flow-focus').addEventListener('click',focus);document.getElementById('flow-explain').addEventListener('click',()=>explain());
 window.informationFlow={get state(){return{enabled,step:index+1,written,filter}},steps};
})();
</script>
