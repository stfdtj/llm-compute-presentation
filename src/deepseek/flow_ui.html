<style>
#flow-toggle{font-size:12px;white-space:nowrap}#flow-toggle[aria-pressed=true]{background:#edf4ff;color:#215ec1;border-color:#5086d9}
#flow-bar{display:none;position:absolute;inset:var(--header-height,66px) 10px 34px;background:#fff;z-index:5;border:1px solid #dfe5ef;border-radius:8px;overflow:hidden}.flow-on #flow-bar{display:flex;flex-direction:column}.flow-on #stage,.flow-on #inspector,.flow-on footer{visibility:hidden}
.shape-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #e3e9f2;background:#f8faff}.shape-toolbar h2{font-size:18px;margin:0 12px 0 0}.shape-toolbar label{display:flex;align-items:center;gap:6px}.shape-toolbar select{max-width:250px}.shape-toolbar button{font-size:12px;padding:5px 9px}.shape-toolbar nav{display:flex;flex-wrap:wrap;gap:5px}.shape-context{padding:7px 16px;color:#526986;border-bottom:1px solid #e3e9f2;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 20px}.shape-context strong{color:#254b80}.shape-scroll{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}.shape-scroll svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff}.shape-node{cursor:pointer;outline:none}.shape-node rect{stroke-width:1.5}.shape-node:focus-visible rect,.shape-node:hover rect{stroke-width:3}.shape-node text,.shape-wire text{pointer-events:none}.shape-node.dim,.shape-wire.dim{opacity:.12}.shape-node.chosen rect{stroke-width:3.5;filter:drop-shadow(0 2px 3px #1e3f6a30)}.shape-node,.shape-wire{transition:opacity .15s}.shape-symbols{padding:8px 16px;border-top:1px solid #e3e9f2;font-size:11px;color:#63738c;background:#f8faff}.shape-status{margin-left:auto;font-size:12px;color:#526986}.shape-legend{font-size:12px;display:flex;gap:16px}.shape-legend span{border-left:3px solid;padding-left:6px}
@media(max-width:780px){#flow-bar{left:5px;right:5px;bottom:5px}.shape-toolbar{padding:8px}.shape-toolbar h2{font-size:16px}.shape-context{padding:6px 8px}.shape-symbols{padding:6px 8px}.shape-status{display:none}.shape-legend{gap:8px;font-size:11px}}
</style>
<section id="flow-bar" aria-label="Shape Trace">
 <div class="shape-toolbar"><h2>Shape Trace</h2><label>Layer <select id="shape-layer" aria-label="Shape Trace Layer"></select></label><button id="shape-prev">←</button><button id="shape-next">→</button><nav aria-label="Shape Trace sections" id="shape-nav"></nav><button id="shape-clear">清除高亮</button><span class="shape-status" id="shape-status">点击模块，追踪上下游</span></div>
 <div class="shape-context"><strong id="shape-context"></strong><span>单 Token Decode · batch 维省略 · 完整模型维度 · 窄屏可横向滚动</span><div class="shape-legend"><span style="border-color:#2863c5">Hidden / Q</span><span style="border-color:#22936b">Local KV</span><span style="border-color:#cb7916">Global / Index</span><span style="border-color:#8a4ec2">MoE / Output</span></div></div>
 <div class="shape-scroll" id="shape-scroll" tabindex="0" aria-label="连续 Shape Trace，可纵向和横向滚动"></div>
 <div class="shape-symbols" id="shape-symbols"></div>
</section>
<script type="application/json" id="shape-config">__SHAPE_CONFIG__</script>
<script>__SHAPE_SCRIPT__</script>
