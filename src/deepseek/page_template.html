.inspector{width:540px}.panel-head{padding:16px 20px 12px}.panel-head h1{font-size:19px}.panel-body{padding:18px 20px 20px}.panel-scope{font-size:12px}.section{margin-bottom:18px}.section h2{font-size:12px;letter-spacing:0;text-transform:none;color:#64738d;margin-bottom:7px}.section p{font-size:14px;line-height:1.75}.calc-step{margin:0 0 20px;padding-bottom:17px;border-bottom:1px solid #e9edf4}.calc-step:last-of-type{padding-bottom:8px}.step-title{font-size:14px;font-weight:650;margin:0 0 11px;color:#20375c}.subhead{font-size:11px;color:#7e8aa0;margin:10px 0 5px}.formulas{background:transparent;border:0;padding:0 4px}.formula{padding:5px 0;font-size:17px}.formula math{font-size:17px}.dimensions{background:#eef5ff;border-left:3px solid #9bbdf0;border-radius:5px;padding:6px 10px;overflow-x:auto}.dimensions .formula math{font-size:15px;color:#255a9f}.symbols{display:grid;grid-template-columns:minmax(62px,auto) 1fr;gap:5px 11px;margin:0;font-size:12px;line-height:1.65}.symbols dt{margin:0;color:#33568a;font-family:Consolas,"Microsoft YaHei",sans-serif;max-width:126px;overflow-wrap:anywhere}.symbols dd{margin:0;color:#5b6981}.step-note{font-size:12px;line-height:1.7;color:#687994;margin:9px 0 0}.teaching-result{padding:12px 14px;background:#f5f8fd;border:1px solid #e4ebf6;border-radius:8px}.teaching-result .row{font-size:13px}.teaching-result .formula math{font-size:16px}.teaching-result .row dd{font-size:14px}.count-explain{font-size:12px;color:#6c7b94;line-height:1.7;margin:7px 0 0}.extra{border:1px solid #e0e7f2;border-radius:7px;margin:13px 0;padding:9px 12px}.extra summary{cursor:pointer;color:#5276a5;font-size:12px}.extra .calc-step{margin-top:17px}.simple-note{font-size:12px;color:#6b7790;line-height:1.7;margin:10px 0}.insight p{font-size:14px}.scope{font-size:11px}.related button{font-size:12px}.row dt{line-height:1.65}.eyebrow{letter-spacing:0} @media(max-width:780px){.inspector{width:min(480px,calc(100vw - 20px))}.panel-body{padding:15px}.symbols{font-size:12px <body>
<header>
 <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong>DeepSeek-V4.1</strong><small>跟着一个 token 走</small></div></div>
 <nav class="modes" aria-label="分析模式"><button data-mode="parameter" aria-pressed="true">参数量</button><button data-mode="forward" aria-pressed="false">FLOPs（前向）</button><button data-mode="backward" aria-pressed="false">FLOPs（反向）</button></nav>
 <div class="scenario"><strong id="mode-caption">看权重矩阵里有多少个数字</strong><span>当前 1 个 token · X = [1,5120]</span></div>
 <div class="tools"><select id="region-select" aria-label="聚焦图中区域"><option value="all">完整架构</option><option value="a">A · 总体架构</option><option value="b">B · 逐层计算</option><option value="c1">C · Encoder 细节</option><option value="c2">C · Decoder 细节</option><option value="c3">C · mHC + MoE</option><option value="d">D · Engram</option></select><button class="square" id="zoom-out" aria-label="缩小">−</button><span id="zoom-value">100%</span><button class="square" id="zoom-in" aria-label="放大">+</button><button id="reset" title="恢复完整图 · 快捷键 0">适合窗口</button></div>
</header>
<main class="stage" id="stage" aria-label="可拖动、缩放的交互架构图">__SVG__</main>
<footer><div class="legend"><span><i class="dot" style="background:#6fbcf5"></i>Attention / Q / KV</span><span><i class="dot" style="background:#83cda0"></i>RMSNorm</span><span><i class="dot" style="background:#b699e8"></i>MoE</span><span><i class="dot" style="background:#eac067"></i>mHC</span><span><i class="dot" style="background:#ee819b"></i>Engram</span></div><span class="hint">点击查看 · 滚轮缩放 · 拖动平移 · Esc 关闭 · 0 复位</span></footer>
<aside class="inspector" id="inspector" role="dialog" aria-modal="false" aria-labelledby="panel-title" aria-hidden="true"><div class="panel-head"><div class="eyebrow" id="panel-mode">参数量 / PARAMETERS</div><h1 id="panel-title"></h1><div class="scope" id="panel-scope"></div><button class="close" id="close-panel" aria-label="关闭计算面板">×</button></div><div class="panel-body" id="panel-body"></div></aside>
<div id="live" role="status" aria-live="polite"></div>
<script type="application/json" id="module-data">__DATA__</script>
<script>
'use strict';
// Calculation content lives in the independent JSON mapping above. Layout stays invariant.
const DATA=JSON.parse(document.getElementById('module-data').textContent);
const svg=document.getElementById('architecture'),stage=document.getElementById('stage'),panel=document.getElementById('inspector'),body=document.getElementById('panel-body');
const labels={parameter:'参数量 · 哪些数字需要学习',forward:'FLOPs（前向）· 当前 token 怎样算',backward:'FLOPs（反向）· 梯度怎样传回来'};
// Keep the reference's narrow label columns legible with locally available fonts.
function fitLabels(){document.querySelectorAll('svg text[data-max-width]').forEach(t=>{const max=Number(t.dataset.maxWidth);t.querySelectorAll('tspan').forEach(s=>{s.removeAttribute('textLength');s.removeAttribute('lengthAdjust');if(s.getComputedTextLength()>max){s.setAttribute('textLength',max);s.setAttribute('lengthAdjust','spacingAndGlyphs');}});});}
fitLabels();document.fonts.ready.then(fitLabels);
const captions={parameter:'看权重矩阵里有多少个数字',forward:'先算当前 token 在一次模块中的运算',backward:'分别计算输入梯度与权重梯度'};
let mode='parameter',selected=null,lastElement=null,view={x:0,y:0,w:1672,h:941},pointer=null,dragged=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function section(title,html){return `<section class="section"><h2>${title}</h2>${html}</section>`;}
function formulas(items){return items.map(x=>`<div class="formula">${x}</div>`).join('');}
function rows(items){return `<dl class="values">${items.map(([a,b])=>`<div class="row"><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`;}
function teachingStep(s){return `<section class="calc-step"><h2 class="step-title">${esc(s.title)}</h2><div class="subhead">计算公式</div><div class="formulas">${formulas(s.formulas)}</div><div class="subhead">矩阵维度 / 实际形状</div><div class="dimensions">${formulas(s.dimensions)}</div><div class="subhead">符号说明</div><dl class="symbols">${s.symbols.map(([a,b])=>`<dt>${esc(a.replaceAll('{','').replaceAll('}',''))}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${s.note?`<p class="step-note">${esc(s.note)}</p>`:''}</section>`;}
function drawPanel(resetScroll=true){
 if(!selected)return;const d=DATA[selected],m=d[mode];
 document.getElementById('panel-title').textContent=d.title;document.getElementById('panel-mode').textContent=labels[mode];document.getElementById('panel-scope').textContent=d.scope+(mode==='backward'?' · 梯度表示各个数字对 Loss 的影响':'');
 let html=section('作用',`<p>${esc(d.purpose)}</p>`);
 if(d.note)html+=`<p class="simple-note">${esc(d.note)}</p>`;
 html+=m.steps.map(teachingStep).join('');
 const countTitle={parameter:'参数量',forward:'FLOPs 计算',backward:'反向计算量'}[mode];
 html+=section(countTitle,`<div class="teaching-result"><div class="formulas">${formulas(m.calculations)}</div>${rows(m.rows)}${m.explain?`<p class="count-explain">${esc(m.explain)}</p>`:''}</div>`+(m.note?`<p class="simple-note">${esc(m.note)}</p>`:''));
 if(m.totals.length)html+=`<details class="extra"><summary>展开看其他计算 / 多层合计</summary>${rows(m.totals)}</details>`;
 for(const extra of m.extras)html+=`<details class="extra teaching-example"><summary>${esc(extra.title)}</summary>${extra.steps.map(teachingStep).join('')}</details>`;
 html+=section('一句话理解',`<div class="insight"><p>${esc(d.insight)}</p></div>`);
 if(d.related.length)html+=section('继续看这几步',`<div class="related">${d.related.map(id=>`<button data-related="${id}">${esc(DATA[id].title.split(' / ')[0])}</button>`).join('')}</div>`);
 const oldScroll=body.scrollTop;body.innerHTML=html;if(resetScroll)body.scrollTop=0;else body.scrollTop=Math.min(oldScroll,body.scrollHeight-body.clientHeight);
 document.getElementById('live').textContent=`${d.title}，${labels[mode]}`;
}
function openPanel(id,element=null){if(!DATA[id])return;selected=id;lastElement=element||lastElement;document.querySelectorAll('.module.selected').forEach(n=>n.classList.remove('selected'));if(element)element.classList.add('selected');else document.querySelectorAll(`.module[data-module="${id}"]`).forEach(n=>n.classList.add('selected'));
 const r=element?.getBoundingClientRect();const onRight=r&&r.left+r.width/2>innerWidth*.55;
 panel.style.left=onRight?'24px':'auto';panel.style.right=onRight?'auto':'24px';drawPanel();panel.classList.add('open');panel.setAttribute('aria-hidden','false');
}
function closePanel(restoreFocus=false){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');document.querySelectorAll('.module.selected').forEach(n=>n.classList.remove('selected'));selected=null;if(restoreFocus&&lastElement?.isConnected)lastElement.focus({preventScroll:true});}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));document.getElementById('mode-caption').textContent=captions[mode];drawPanel(true);}));
body.addEventListener('click',e=>{const b=e.target.closest('[data-related]');if(b){const id=b.dataset.related;openPanel(id,document.querySelector(`.module[data-module="${id}"]`));}});
document.getElementById('close-panel').addEventListener('click',()=>closePanel(true));
// A related-item click replaces its own DOM node before bubbling; contain it here.
panel.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',e=>{if(panel.contains(e.target)||e.target.closest('[data-mode],.module'))return;if(!dragged)closePanel();});
svg.addEventListener('click',e=>{if(dragged){dragged=false;return;}const g=e.target.closest('.module');if(g)openPanel(g.dataset.module,g);else closePanel();});
svg.addEventListener('keydown',e=>{const g=e.target.closest('.module');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPanel(g.dataset.module,g);document.getElementById('close-panel').focus();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel(true);if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.key==='0')reset();});
function paint(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);document.getElementById('zoom-value').textContent=Math.round(1672/view.w*100)+'%';}
function point(x,y){const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoom(factor,anchor){const s=Math.max(.6,Math.min(6,1672/view.w*factor)),w=1672/s,h=941/s,p=anchor||{x:view.x+view.w/2,y:view.y+view.h/2};view={x:p.x-(p.x-view.x)*w/view.w,y:p.y-(p.y-view.y)*h/view.h,w,h};paint();}
function reset(){view={x:0,y:0,w:1672,h:941};document.getElementById('region-select').value='all';paint();}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0014),point(e.clientX,e.clientY));},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,last:point(e.clientX,e.clientY)};dragged=false;});
svg.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(!dragged&&Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5){dragged=true;stage.classList.add('dragging');svg.setPointerCapture(e.pointerId);}if(dragged){const p=point(e.clientX,e.clientY);view.x+=pointer.last.x-p.x;view.y+=pointer.last.y-p.y;paint();pointer.last=point(e.clientX,e.clientY);}});
function endDrag(e){if(pointer?.id===e.pointerId){if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);pointer=null;stage.classList.remove('dragging');}}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);svg.addEventListener('pointerleave',e=>{if(pointer&&!dragged)pointer=null;});
svg.addEventListener('dblclick',e=>{if(!e.target.closest('.module'))reset();});
document.getElementById('zoom-in').addEventListener('click',()=>zoom(1.3));document.getElementById('zoom-out').addEventListener('click',()=>zoom(1/1.3));document.getElementById('reset').addEventListener('click',reset);
const regions={a:[0,75,1672,283],b:[10,365,1652,209],c1:[10,580,493,343],c2:[502,580,380,343],c3:[879,580,504,343],d:[1382,580,282,343]};
document.getElementById('region-select').addEventListener('change',e=>{if(e.target.value==='all'){reset();return;}const [x,y,w,h]=regions[e.target.value],pad=18,r=1672/941,nw=Math.max(w+pad*2,(h+pad*2)*r),nh=nw/r;view={x:x+w/2-nw/2,y:y+h/2-nh/2,w:nw,h:nh};paint();});
// Read-only inspection hooks for reproducible browser QA.
window.architectureApp={get state(){return{mode,selected,view:{...view}}},data:DATA};
paint();
</script>
</body></html>
