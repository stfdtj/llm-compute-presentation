<section id="learning-workspace" aria-label="DeepSeek 学习工作区">
 <div class="learn-header"><strong>DeepSeek V4.1 Flash</strong><nav class="learn-nav" aria-label="学习路径"><button data-workspace="overview">01 总体架构</button><button data-workspace="csa2">02 CSA2 详解</button><button data-workspace="flow">03 数据流</button><button data-workspace="compute">04 局部计算</button><button data-workspace="evidence">05 实现与证据</button></nav></div><main class="learn-body" id="learn-body"></main>
</section><button class="learn-back" id="learn-return">← 返回学习主线</button>
<script>
(()=>{
 const root=document.getElementById('learning-workspace'),content=document.getElementById('learn-body');let active=false,workspace='overview',scenario='decode',step=0,csa2Step=0;
 const ledger=derivationTeaching.data;
 const node=(title,subtitle,action='',kind='')=>`<button class="learn-node ${kind}" ${action}><strong>${title}</strong><small>${subtitle}</small></button>`;
 const chain=items=>`<div class="learn-chain">${items.join('<span class="learn-arrow" aria-hidden="true">→</span>')}</div>`;
 const actions='<div class="learn-actions"><button data-detail="attention">对照 Encoder / Decoder Attention</button><button data-workspace="compute">选模块看计算 →</button><button data-detail="all">原始完整架构与高级账本</button></div>';
 const backbone43Launch='<div class="learn-actions"><button data-backbone43-open="input">展开完整 43 层主干图（drawio 对齐）→</button><button data-workspace="csa2">CSA2 详解 →</button></div>';
 const overview=()=>`<h1>40 层产生输出，3 层草稿减少串行轮数</h1><p class="learn-intro">当前 Decode token 经过完整主干，由 LM Head 预测下一个 token。每层计算自己的 Q / Local KV；Global KV 由源层生成、后续层复用。可选 DSpark 一次处理 5 个草稿位置，候选再交给主模型验证。</p>${chain([node('Input → Embedding','当前 token → 四路 Hidden State','data-module-open="embedding"'),node('Encoder · L0–19','20 层；L0–1 仅 Local','data-detail="attention"'),node('Decoder · L20–39','20 层；Global KV 源为 L20','data-detail="attention"'),node('HC 合并 → Final Norm','四路 → 一路 Hidden State','data-module-open="finalnorm"'),node('LM Head → token t₀','logits → sample；正常输出','data-module-open="head"')])}<div class="learn-boundary"><strong>L20 边界</strong>　E = H19 [1,4,5120] → <b>HC Pre → Attention RMSNorm</b> → X20 [1,5120] → Q / Local KV / Full Global KV。<br>Global：L20 <b>Full</b>；L24 / 28 / 32 / 36 <b>Reindex</b>；其余 L21–39 <b>Reuse</b>。后续层 Q / Local 来自各自 X。</div><section class="learn-branch"><h2>可选 DSpark · 主干之外的辅助路径</h2><span class="learn-badge">A：L37/38/39 的 Block 输入 → 各自四路 mean → Concat / Projection / RMSNorm → main_x</span>${chain([node('A 条件 + B 锚点 t₀','B → t₀ + 4 noise → Embedding','data-draft="inputs"'),node('Draft Blocks 1 → 2 → 3','3 是深度；每层处理 5 个位置','data-draft="blocks"'),node('Draft Head → c₁…c₅','共享 LM + Markov；5 个候选','data-draft="heads"'),node('主模型验证 → 接受前缀','论文调度 / 验证；绿色虚线边界','data-draft="verification"','verify')])}<span class="learn-badge">A 的 main_x 进入每个 Draft Attention 的上下文 KV；Confidence 只辅助调度，不决定接受。返回 1 anchor + 5 candidates。</span></section><div class="learn-grid"><section class="learn-card"><h2>相同计算，Global 分支不同</h2><p>双方都有串行低秩 Q、Local KV、RoPE、Attention、Inverse RoPE 与输出投影。Encoder 的 Global 源层 L2 / 8 / 14 使用 2:1 压缩；Decoder L20 使用 1:1，之后共享缓存。</p></section><section class="learn-card"><h2>为什么共享？在哪个场景省计算？</h2><p>跨层共享避免重复生成 Global KV。论文 Prefill 还描述后半主干 bounded replay；固定参考代码仍逐层处理全部输入位置。Decode 当前 token 仍走完 40 层。</p></section></div>${backbone43Launch}${actions}`;
 const CSA2_WALK=[
  ['L2','Full','L2 · 新建 (2:1)','L2 · 新建','L2 · 新建','—（候选池只在 L20 建立）','L2 · 本层自算','L2 · 本层自算','本层新建压缩 KV 并运行 Indexer，之后 5 层共用。'],
  ['L3','Reuse','L2（未变）','L2（未变）','L2（未变）','—','L3 · 本层自算','L3 · 本层自算','不碰压缩 KV / Indexer，只做自己的 Local KV 和 Query。'],
  ['L8','Full','L8 · 新建 (2:1)','L8 · 新建','L8 · 新建','—','L8 · 本层自算','L8 · 本层自算','新的 Full 层覆盖上一组：L2 的压缩 KV 不再被读取。'],
  ['L14','Full','L14 · 新建 (2:1)','L14 · 新建','L14 · 新建','—','L14 · 本层自算','L14 · 本层自算','Engram 在本层之前先注入；随后照常运行 Full CSA2。'],
  ['L20','Full','L20 · 新建 (1:1)','L20 · 新建','L20 · 新建','L20 · 新建 2048×8 候选块','L20 · 本层自算','L20 · 本层自算','Encoder→Decoder 分界；Decoder 唯一的 KV source。'],
  ['L21','Reuse','L20（未变）','L20（未变）','L20（未变）','L20（未变）','L21 · 本层自算','L21 · 本层自算','复用 L20 的 KV、Index Key、Top-k 和候选块掩码。'],
  ['L24','Reindex','L20（未变）','L20（未变）','L24 · 新选（在 L20 候选块内重新打分）','L20（未变，用于限定重打分范围）','L24 · 本层自算','L24 · 本层自算','不新建 KV；只用本层 Query 在候选块内重新选 Top-k。'],
  ['L25','Reuse','L20（未变）','L20（未变）','L24（最近一次）','L20（未变）','L25 · 本层自算','L25 · 本层自算','复用 L24 刚刷新的 Top-k，直到 L28 再次 Reindex。'],
 ];
 function csa2State(i){
  const [layer,mode,kv,ik,tk,cand,lkv,q,note]=CSA2_WALK[i];
  return `<div class="csa2-state"><div><b>Global KV source</b>${kv}</div><div><b>Index Key source</b>${ik}</div><div><b>最新 Top-k 来源</b>${tk}</div><div><b>候选块来源</b>${cand}</div><div><b>Local KV 来源</b>${lkv}</div><div><b>Query 来源</b>${q}</div></div><p class="csa2-note">${note}</p>`;
 }
 function scheduleRow(range,mode,src,cls){return `<tr class="${cls}"><td>${range}</td><td>${mode}</td><td>${src}</td></tr>`;}
 function csa2(){return `<h1>CSA2 · Compressed Sparse Attention 2</h1><p class="learn-intro">CSA2 要解决的问题：让每一层既能便宜地看"最近"（Local KV），也能便宜地看"很久以前但被选中"的历史（Compressed KV + Indexer），而不必对全部历史做一次完整 Attention。</p>
  <div class="csa2-analogy">
   <div style="background:#E3F7F0"><b>Local KV</b>最近 128 个位置；每一层都自己重新计算，谁都不共享。</div>
   <div style="background:#E7EDFF"><b>Compressed KV</b>更早历史的压缩摘要；只有少数"源层"生成，之后很多层共用同一份。</div>
   <div style="background:#FFEAF2"><b>Indexer</b>只负责"挑地址"：从压缩摘要里选出当前最值得读的位置编号，不产生 Attention 的最终输出。</div>
   <div style="background:#F0F6FF"><b>Attention</b>真正去读 Local KV + 被选中的 Compressed KV，一次共同归一化，算出新的表示。</div>
  </div>
  <div class="learn-actions"><button data-csa2-open="full">展开 CSA2 单层数据流图 →</button><button data-detail="indexer">打开层级化 Indexer 完整流程 →</button></div>

  <h2>Full / Reindex / Reuse 三种模式</h2>
  <div class="csa2-cmp">
   <div class="full"><h3>Full</h3><p>计算自己的 Query + Local KV；<b>新建</b>压缩 Global KV；<b>新建/刷新</b> Index Key；运行 Indexer 选出新 Top-k；用 Local + 选中的 Global KV 做一次 Attention。</p></div>
   <div class="reindex"><h3>Reindex</h3><p>计算自己的 Query + Local KV；<b>复用</b>已有 Global KV 和 Index Key（不重建）；只用自己的 Query 重新打分，选出<b>新的</b> Top-k；在候选块掩码内完成。</p></div>
   <div class="reuse"><h3>Reuse</h3><p>计算自己的 Query + Local KV；<b>复用</b>已有 Global KV；<b>复用</b>最近一次选出的 Top-k；不重建压缩 KV，也不重新打分。</p></div>
  </div>
  <p class="learn-intro">三种模式下，<b>每一层永远都重新计算自己的 Query 和 Local KV</b> —— 区别只在"压缩 KV / Index Key / Top-k 是新建、重新打分，还是直接复用"。</p>

  <h2>CSA2 层级一览表（按 config.json 的 kv_source_layers / index_source_layers 核实）</h2>
  <table class="csa2-table"><thead><tr><th>层</th><th>CSA2 行为</th><th>Global KV 来源</th></tr></thead><tbody>
   ${scheduleRow('0–1','Local SWA only（无 Global KV）','—','csa2-local')}
   ${scheduleRow('2','Full','Layer 2','csa2-full')}
   ${scheduleRow('3–7','Reuse','Layer 2','csa2-reuse')}
   ${scheduleRow('8','Full','Layer 8','csa2-full')}
   ${scheduleRow('9–13','Reuse','Layer 8','csa2-reuse')}
   ${scheduleRow('14','Full','Layer 14','csa2-full')}
   ${scheduleRow('15–19','Reuse','Layer 14','csa2-reuse')}
   ${scheduleRow('20','Full','Layer 20','csa2-full')}
   ${scheduleRow('21–23','Reuse','Layer 20','csa2-reuse')}
   ${scheduleRow('24','Reindex','Layer 20','csa2-reindex')}
   ${scheduleRow('25–27','Reuse','Layer 20','csa2-reuse')}
   ${scheduleRow('28','Reindex','Layer 20','csa2-reindex')}
   ${scheduleRow('29–31','Reuse','Layer 20','csa2-reuse')}
   ${scheduleRow('32','Reindex','Layer 20','csa2-reindex')}
   ${scheduleRow('33–35','Reuse','Layer 20','csa2-reuse')}
   ${scheduleRow('36','Reindex','Layer 20','csa2-reindex')}
   ${scheduleRow('37–39','Reuse','Layer 20','csa2-reuse')}
  </tbody></table>
  <p class="learn-intro">压缩 KV 只在 L2/8/14/20 这 4 层新建（config.json 的 <code>kv_source_layers</code>）；Top-k 在这 4 层 + L24/28/32/36 共 8 层刷新（<code>index_source_layers</code>）。L24/28/32/36 不新建 KV，只用自己的 Query 在 L20 的压缩 KV 上重新打分。</p>

  <h2>Encoder vs Decoder：1024-token Prefill 例子</h2>
  <div class="learn-grid">
   <section class="learn-card"><h2>Encoder L2– 19 · 压缩比 2:1</h2><p>1024 个完整输入 token，源层用可学习权重把相邻两个 token 的表示加权合并（不是简单平均），产生 <b>512</b> 条压缩位置。</p></section>
   <section class="learn-card"><h2>Decoder L20–39 · 压缩比 1:1</h2><p>1024 个位置经过投影，产生 <b>1024</b> 条 Global KV 条目——没有两两合并，但 1:1 仍然是一次独立的投影，<b>不等于"不压缩/不处理"</b>，只是不做时间维度的池化。</p></section>
  </div>
  <p class="learn-intro">压缩比（多少个 token 合成一条）和隐藏维度变化（512 维投影本身）是两件不同的事：Decoder 的 1:1 仍然改变了表示的维度和内容，只是没有"每两个 token 合成一个"的池化步骤。</p>

  <h2>层级化 Indexer：候选块 vs Top-k</h2>
  <p class="learn-intro">L20 额外做一次"候选块预筛选"：把压缩位置按 8 个一组打包，最多选出 2048 个候选块（16384 个位置的上限池）。L24 / 28 / 32 / 36 之后只在<b>这个候选池内部</b>用自己的 Query 重新打分选 Top-k —— 不是重新跑一次候选块筛选。在 1024-token 的例子里，可用的压缩位置（最多 1024 条）本来就少于候选块预算，所以这一步在这个小例子里不一定带来明显的剪枝效果，这里不编造额外的加速数字。</p>
  <p class="learn-intro"><b>常见误解纠正：</b>L21–23 这类 Reuse 层直接复用 L20 选好的 Top-k 位置和候选块掩码，并不会重新跑一遍候选块过滤流程。</p>

  <h2>CSA2 互动走查：L2 → L3 → L8 → L14 → L20 → L21 → L24 → L25</h2>
  <div class="learn-flow"><section class="learn-card current"><h2>${csa2Step+1} → Layer ${CSA2_WALK[csa2Step][0]}</h2><strong>${CSA2_WALK[csa2Step][1]} 模式</strong>${csa2State(csa2Step)}</section></div>
  <div class="learn-actions"><button id="csa2-prev" ${csa2Step===0?'disabled':''}>上一步</button><span aria-live="polite">${csa2Step+1} / ${CSA2_WALK.length}</span><button id="csa2-next" ${csa2Step===CSA2_WALK.length-1?'disabled':''}>下一步</button><button id="csa2-step-reset">重置</button></div>

  <h2>CSA2 与 CED（Causal Encoder–Decoder）不是同一回事</h2>
  <div class="learn-grid">
   <section class="learn-card"><h2>逻辑模型架构</h2><p>技术报告描述的 Causal Encoder–Decoder：Decoder 的 Global KV 来自 Encoder 端表示，Prefill 可用 bounded replay 优化。</p></section>
   <section class="learn-card"><h2>参考实现 model.py</h2><p>40 层顺序执行同一个 Block 类；用 kv_source_layers / index_source_layers 配置实现跨层共享缓存（即本页的 CSA2）。没有独立 Cross-Attention 模块，也没有实现 bounded replay。</p></section>
  </div>
  <p class="learn-intro">本页只在技术报告有说明但参考代码未实现时才会特别标注"仅论文描述"；其余内容均以 <code>model.py</code> / <code>config.json</code> 为准。</p>
  ${actions}`;}
 const flows={
 decode:[['当前 1 token','A · B=1，已有 1024 历史位置','Embedding → [1,1,4,5120]；继续经过 L0–39。'],['Encoder / L20 边界','E → HC Pre / Norm → X20','Encoder Global 2:1 源层 2/8/14；L20 以 1:1 生成 Global KV。'],['缓存写入与读取','本层 Q + Local + Global → Attention','每层独立 Local 窗口 ≤128；L20 Global 当前写入后有 1025 行 × 512维，最多检索 512 行。'],['完成当前状态更新','Inverse RoPE → W_OA / W_OB → HC / MoE','最终 HC 合并 → Norm → LM Head → 下一 token。历史 KV 不重新经过每个 Decoder 层投影。']],
 prefill:[['整段 1024 token','参考代码 · start_pos=0','Embedding → [1,1024,4,5120]；Transformer.forward 对所有输入位置遍历 40 层。'],['生成各层缓存','Encoder Full 2/8/14；Decoder Full20','Encoder 2:1 对齐后 512 条 Global；L20 1:1 为 1024 条。RoPE/量化后写缓存。'],['后半主干的执行边界','参考实现：全部位置仍执行','论文优化：历史 Global KV 一次投影，末尾窗口 bounded replay 建立 Local KV，最终位置继续输出；固定 model.py 没有此分支。'],['输出与草稿初始化','LM Head → logits；DSpark 缓存初始化','参考代码返回各位置预测；生成流程使用末尾预测。forward_spec(start_pos=0) 只填 Draft 上下文 KV，返回 None。']],
 draft:[['来源 A + B','L37/38/39 Block 输入；主模型 t₀','各层 mean(四路) → [1,5120]，Concat [1,15360] × [15360,5120] → RMSNorm；B 建立 5 位置。'],['3 个 Draft Blocks','5 位置每层成块计算','main_x → 各 Draft 层自己的上下文 KV；草稿块内双向 Attention，无主干 Global / Indexer。'],['LM + Markov + Confidence','forward_spec 参考代码边界','5 组 base logits + 5 次轻量 Markov 采样 → [t₀,c₁…c₅]；另返回 5 raw confidence。'],['论文调度与主模型验证','论文流程；非 forward_spec 已实现','校准 confidence 选择候选前缀；同一主模型计算目标分布并按接受规则检查，提交接受前缀 + 纠正/补充 token。']]
 };
 function flow(){return `<h1>同一模型，三种不同执行场景</h1><div class="learn-scenario">${[['prefill','Prefill · 1024 输入'],['decode','Decode · 1024 历史 + 1 当前'],['draft','DSpark · Draft & Verify']].map(([k,t])=>`<button data-scenario="${k}" aria-pressed="${scenario===k}">${t}</button>`).join('')}</div><div class="learn-flow">${flows[scenario].map((s,i)=>`<section class="learn-card ${i===step?'current':''}"><h2>${i+1} → ${s[0]}</h2><strong>${s[1]}</strong><p>${s[2]}</p></section>`).join('')}</div><div class="learn-actions"><button id="learn-prev" ${step===0?'disabled':''}>上一步</button><span aria-live="polite">${step+1} / 4</span><button id="learn-next" ${step===3?'disabled':''}>下一步</button><button id="learn-reset">重置场景</button></div><div class="learn-boundary">位置数 ≠ 向量宽度：<b>[1024,512]</b> 是 1024 行、每行 512 维；<b>TopK 512</b> 是至多检索 512 条 Global；<b>Local 128</b> 是窗口位置上限（含当前）。<b>2:1 / 1:1</b> 是压缩比例；2:1 仅完整配对后增加条目。</div><div class="learn-grid" style="margin-top:16px"><section class="learn-card"><h2>Full / Reindex / Reuse</h2><p>Full：生成 Global KV、Index Key 并检索；Reindex：复用 KV / Key，重新打分选位置；Reuse：复用 KV 和已选位置。每层仍重算自己的 Q / Local KV。</p><p>Encoder：L0–1 仅 Local；L2/8/14 Full，之后至下一源层前 Reuse。Decoder：L20 Full，L24/28/32/36 Reindex，其余 Reuse。</p></section><section class="learn-card"><h2>三种分数去向不同</h2><p>Indexer 分数 → 筛 Global 位置；Attention 分数 → Local + Global 共同归一化后汇总；LM Head logits → 词表 token。缓存不是绕过 Decoder 直接生成 token 的路径。</p></section></div>${actions}<div class="learn-actions"><button data-detail="flow">进入原图逐步追踪</button><button data-draft="prefill">DSpark Prefill / Decode 细节</button></div>`;}
 function compute(){return `<h1>选择计算节点，再逐级展开</h1><p class="learn-intro">默认只看形状、核心公式与数量级；Level 2 看逻辑步骤，Level 3 保留完整权重与审计账本。Forward 默认 A：当前 1 token、1024 历史；Backward 默认 B：从起点重算 128 token 的理论实数图。</p><input class="learn-search" id="learn-search" aria-label="搜索计算模块" placeholder="搜索模块，如 Global、MoE、HC…"><div class="learn-module-grid" id="learn-modules">${Object.entries(DATA).map(([k,d])=>`<button data-module-open="${k}"><strong>${esc(d.title)}</strong><small>${esc(d.purpose)}</small></button>`).join('')}</div><p>参数量是存储权重；Activated 是当前 token 触达权重；FLOPs 是操作数；Memory Bytes 不属于 FLOPs。<a href="index.html">独立 Compute Lab（Roofline / MFU）</a> 使用各自建模假设，不是本模型实测性能。</p>`;}
 function evidence(){return `<h1>实现与证据</h1><p class="learn-intro">源码与配置固定到 revision <code>${ledger.revision}</code>。计算展示直接读取已有账本，未复制另一份 FLOPs 常量。</p><div class="learn-grid">${[['Verified','源码 / 配置：40 层主干、3 草稿层、5 位置、权重形状及共享关系。'],['Derived','给定实数计算图的数学推导；不等于官方训练 kernel 已验证。'],['Estimated','2MKN 矩阵近似及明示假设；不表示硬件运行时间。'],['Unknown','离散 TopK 梯度、量化训练策略、分布式 kernel / 通信、优化器成本及完整推测缓存提交回滚。']].map(([k,v])=>`<section class="learn-card"><h2>${k}</h2><p>${v}</p></section>`).join('')}</div><details><summary>审计清单、计数约定与原始来源</summary><p>普通加减乘逐项计数；exp / sqrt / rsqrt / div 等特殊函数单列。主路径与给定额外梯度的条件 VJP 分账；A 历史缓存梯度止于缓存，B 才从起点重算。</p><p><a href="references/deepseek/manifest.json">固定源 SHA256 清单</a> · <a href="references/deepseek/inference/model.py">model.py</a> · <a href="references/deepseek/inference/config.json">config.json</a> · <a href="references/deepseek/technical_report.pdf">本地技术报告</a> · <a href="https://arxiv.org/html/2607.05147v1">DSpark 论文</a></p><p>源码只包含草稿前向；概率校准 / prefix scheduler / 接受纠正 / 完整缓存推进属于论文或推理引擎。bounded replay 不在固定参考 model.py 中实现。没有运行模型权重或 GPU 性能测量。</p><button id="learn-audit">打开原参数总账与源码行号</button></details>`;}
 function render(){content.innerHTML=({overview,csa2,flow,compute,evidence})[workspace]();document.querySelectorAll('.learn-nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.workspace===workspace?'page':'false'));if(workspace==='compute')document.getElementById('learn-search').oninput=e=>{const q=e.target.value.toLowerCase();content.querySelectorAll('[data-module-open]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));};}
 function show(which='overview'){closePanel();if(informationFlow.state.enabled)document.getElementById('flow-toggle').click();active=true;workspace=which;document.body.classList.add('learning-on');render();root.scrollTop=0;}
 function detail(which){active=false;document.body.classList.remove('learning-on');closePanel();if(which==='flow'){document.getElementById('flow-toggle').click();return;}if(which==='attention'){const r=document.getElementById('region-select');r.value='attention';r.dispatchEvent(new Event('change',{bubbles:true}));attentionComparison.show();return;}if(which==='dspark'){dsparkArchitecture.show();return;}dsparkArchitecture.hide(false);const r=document.getElementById('region-select');r.value=which;r.dispatchEvent(new Event('change',{bubbles:true}));}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();if(b.dataset.workspace)show(b.dataset.workspace);if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.draft)dsparkArchitecture.detail(b.dataset.draft);if(b.dataset.scenario){scenario=b.dataset.scenario;step=0;render();}if(b.id==='learn-next'){step++;render();document.getElementById('learn-next').focus();}if(b.id==='learn-prev'){step--;render();document.getElementById('learn-prev').focus();}if(b.id==='learn-reset'){step=0;render();}if(b.dataset.moduleOpen){progressiveCompute.reset();document.querySelector('.modes [data-mode=forward]').click();openPanel(b.dataset.moduleOpen,b);document.getElementById('close-panel').focus();}if(b.id==='learn-audit'){document.getElementById('assumptions-toggle').click();}if(b.id==='csa2-next'){csa2Step=Math.min(CSA2_WALK.length-1,csa2Step+1);render();document.getElementById('csa2-next').focus();}if(b.id==='csa2-prev'){csa2Step=Math.max(0,csa2Step-1);render();document.getElementById('csa2-prev').focus();}if(b.id==='csa2-step-reset'){csa2Step=0;render();}if(b.dataset.csa2Open){active=false;document.body.classList.remove('learning-on');closePanel();window.csa2Teaching.show(b.dataset.csa2Open);}if(b.dataset.backbone43Open){active=false;document.body.classList.remove('learning-on');closePanel();window.backbone43Teaching.show(b.dataset.backbone43Open);}});
 document.getElementById('learn-return').onclick=e=>{e.stopPropagation();show(workspace);};
 for(const id of ['dspark-dialog','attention-comparison']){const dialog=document.getElementById(id);dialog?.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});}
 window.learningWorkspace={show,detail,get state(){return{active,workspace,scenario,step};}};
 if(!['#architecture','#dspark'].includes(location.hash))show();
})();
</script>
