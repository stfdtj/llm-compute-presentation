<style>
#learning-workspace{display:none;position:fixed;inset:0;background:#f6f8fc;z-index:5;overflow:auto;color:#193052}.learning-on #learning-workspace{display:block}.learning-on>.stage,.learning-on>header,.learning-on>footer{visibility:hidden}.learn-header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dbe3ef;padding:14px max(18px,calc((100vw - 1200px)/2));display:flex;gap:18px;align-items:center;flex-wrap:wrap}.learn-header strong{font-size:16px}.learn-nav{display:flex;gap:5px;flex-wrap:wrap}.learn-nav button{font-size:13px}.learn-nav button[aria-current=page]{background:#e9f1ff;border-color:#8aaee2;color:#245aca}.learn-body{max-width:1240px;margin:auto;padding:22px 24px 40px}.learn-body h1{font-size:27px;margin:0 0 8px}.learn-body h2{font-size:18px;margin:0 0 9px}.learn-intro{color:#526781;max-width:960px;line-height:1.7;margin:0 0 18px}.learn-chain{display:flex;align-items:stretch;gap:0;margin:14px 0}.learn-node{min-width:0;flex:1;border:1px solid #a8c3e4;background:#edf5ff;border-radius:9px;padding:15px 10px;text-align:center;font-size:14px;line-height:1.6;display:flex;flex-direction:column;justify-content:center}.learn-node strong{display:block}.learn-node small{display:block;color:#4b6485;font-size:12px}.learn-arrow{align-self:center;padding:0 9px;color:#3769a4;font-size:23px}.learn-branch{border:1px dashed #a987ce;border-radius:12px;padding:15px 18px;background:#fbf8ff;margin:18px 0}.learn-branch .learn-node{background:#f1eaff;border-color:#b89adb}.learn-node.verify{background:#eaf7ef;border:1px dashed #5d9f7a}.learn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.learn-card{border:1px solid #dae3ef;border-radius:10px;background:#fff;padding:16px;min-width:0}.learn-card p{font-size:13px;line-height:1.8;margin:8px 0}.learn-card code{overflow-wrap:anywhere}.learn-boundary{padding:12px 16px;background:#fff7e9;border-left:3px solid #daa748;border-radius:4px;font-size:13px;line-height:1.8}.learn-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.learn-badge{font-size:12px;color:#5a4784}.learn-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.learn-flow .learn-card{border-top:3px solid #8daed7}.learn-flow .learn-card.current{border-color:#2962b4;background:#eff6ff;box-shadow:0 0 0 2px #d4e4fb}.learn-flow .learn-card h2{font-size:16px}.learn-scenario{display:flex;gap:7px;flex-wrap:wrap}.learn-scenario button[aria-pressed=true]{background:#e6f0ff;border-color:#6491cd}.learn-search{width:100%;padding:10px;border:1px solid #b9cce5;border-radius:7px;font:inherit}.learn-module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.learn-module-grid button{text-align:left;white-space:normal;padding:16px;background:#fff;min-width:0}.learn-module-grid small{display:block;color:#627790;margin-top:6px}.learn-body a{color:#245aca}.learn-body details{padding:10px 0}.learn-body summary{cursor:pointer}.learning-on .inspector{top:100px;max-height:calc(100dvh - 120px);width:550px}.learn-back{position:fixed;bottom:36px;left:14px;z-index:6;background:#fff;border-color:#779cca}.learning-on .learn-back{display:none}.learn-body [hidden]{display:none!important}
@media(max-width:800px){.learn-header{padding:12px;gap:8px}.learn-nav button{font-size:12px;padding:7px}.learn-body{padding:18px 15px}.learn-body h1{font-size:23px}.learn-chain{flex-wrap:wrap;gap:8px}.learn-node{flex:1 1 28%;padding:12px 7px}.learn-arrow{padding:0 2px}.learn-grid,.learn-flow{grid-template-columns:1fr 1fr}.learn-module-grid{grid-template-columns:1fr 1fr}.learning-on .inspector{top:112px;max-height:calc(100dvh - 130px)}}
@media(max-width:800px){.learn-chain{display:flex;flex-direction:column;align-items:stretch;gap:3px}.learn-node{flex:auto;width:100%;padding:10px}.learn-arrow{transform:rotate(90deg);padding:0;font-size:18px;line-height:18px}.learn-grid,.learn-flow,.learn-module-grid{grid-template-columns:1fr}.learn-header{position:sticky}.learn-nav{gap:3px}.learn-nav button{font-size:11px;padding:6px}.learn-body{padding:15px 12px}.learn-branch{padding:12px}.learning-on .inspector{top:105px;max-height:calc(100dvh - 120px)}.learn-back{font-size:11px}}
</style>
<section id="learning-workspace" aria-label="DeepSeek 学习工作区">
 <div class="learn-header"><strong>DeepSeek V4.1 Flash</strong><nav class="learn-nav" aria-label="学习路径"><button data-workspace="overview">01 总体架构</button><button data-workspace="flow">02 数据流</button><button data-workspace="compute">03 局部计算</button><button data-workspace="evidence">04 实现与证据</button></nav></div><main class="learn-body" id="learn-body"></main>
</section><button class="learn-back" id="learn-return">← 返回学习主线</button>
<script>
(()=>{
 const root=document.getElementById('learning-workspace'),content=document.getElementById('learn-body');let active=false,workspace='overview',scenario='decode',step=0;
 const ledger=derivationTeaching.data;
 const node=(title,subtitle,action='',kind='')=>`<button class="learn-node ${kind}" ${action}><strong>${title}</strong><small>${subtitle}</small></button>`;
 const chain=items=>`<div class="learn-chain">${items.join('<span class="learn-arrow" aria-hidden="true">→</span>')}</div>`;
 const actions='<div class="learn-actions"><button data-detail="attention">对照 Encoder / Decoder Attention</button><button data-workspace="compute">选模块看计算 →</button><button data-detail="all">原始完整架构与高级账本</button></div>';
 const overview=()=>`<h1>40 层产生输出，3 层草稿减少串行轮数</h1><p class="learn-intro">当前 Decode token 经过完整主干，由 LM Head 预测下一个 token。每层计算自己的 Q / Local KV；Global KV 由源层生成、后续层复用。可选 DSpark 一次处理 5 个草稿位置，候选再交给主模型验证。</p>${chain([node('Input → Embedding','当前 token → 四路 Hidden State','data-module-open="embedding"'),node('Encoder · L0–19','20 层；L0–1 仅 Local','data-detail="attention"'),node('Decoder · L20–39','20 层；Global KV 源为 L20','data-detail="attention"'),node('HC 合并 → Final Norm','四路 → 一路 Hidden State','data-module-open="finalnorm"'),node('LM Head → token t₀','logits → sample；正常输出','data-module-open="head"')])}<div class="learn-boundary"><strong>L20 边界</strong>　E = H19 [1,4,5120] → <b>HC Pre → Attention RMSNorm</b> → X20 [1,5120] → Q / Local KV / Full Global KV。<br>Global：L20 <b>Full</b>；L24 / 28 / 32 / 36 <b>Reindex</b>；其余 L21–39 <b>Reuse</b>。后续层 Q / Local 来自各自 X。</div><section class="learn-branch"><h2>可选 DSpark · 主干之外的辅助路径</h2><span class="learn-badge">A：L37/38/39 的 Block 输入 → 各自四路 mean → Concat / Projection / RMSNorm → main_x</span>${chain([node('A 条件 + B 锚点 t₀','B → t₀ + 4 noise → Embedding','data-draft="inputs"'),node('Draft Blocks 1 → 2 → 3','3 是深度；每层处理 5 个位置','data-draft="blocks"'),node('Draft Head → c₁…c₅','共享 LM + Markov；5 个候选','data-draft="heads"'),node('主模型验证 → 接受前缀','论文调度 / 验证；绿色虚线边界','data-draft="verification"','verify')])}<span class="learn-badge">A 的 main_x 进入每个 Draft Attention 的上下文 KV；Confidence 只辅助调度，不决定接受。返回 1 anchor + 5 candidates。</span></section><div class="learn-grid"><section class="learn-card"><h2>相同计算，Global 分支不同</h2><p>双方都有串行低秩 Q、Local KV、RoPE、Attention、Inverse RoPE 与输出投影。Encoder 的 Global 源层 L2 / 8 / 14 使用 2:1 压缩；Decoder L20 使用 1:1，之后共享缓存。</p></section><section class="learn-card"><h2>为什么共享？在哪个场景省计算？</h2><p>跨层共享避免重复生成 Global KV。论文 Prefill 还描述后半主干 bounded replay；固定参考代码仍逐层处理全部输入位置。Decode 当前 token 仍走完 40 层。</p></section></div>${actions}`;
 const flows={
 decode:[['当前 1 token','A · B=1，已有 1024 历史位置','Embedding → [1,1,4,5120]；继续经过 L0–39。'],['Encoder / L20 边界','E → HC Pre / Norm → X20','Encoder Global 2:1 源层 2/8/14；L20 以 1:1 生成 Global KV。'],['缓存写入与读取','本层 Q + Local + Global → Attention','每层独立 Local 窗口 ≤128；L20 Global 当前写入后有 1025 行 × 512维，最多检索 512 行。'],['完成当前状态更新','Inverse RoPE → W_OA / W_OB → HC / MoE','最终 HC 合并 → Norm → LM Head → 下一 token。历史 KV 不重新经过每个 Decoder 层投影。']],
 prefill:[['整段 1024 token','参考代码 · start_pos=0','Embedding → [1,1024,4,5120]；Transformer.forward 对所有输入位置遍历 40 层。'],['生成各层缓存','Encoder Full 2/8/14；Decoder Full20','Encoder 2:1 对齐后 512 条 Global；L20 1:1 为 1024 条。RoPE/量化后写缓存。'],['后半主干的执行边界','参考实现：全部位置仍执行','论文优化：历史 Global KV 一次投影，末尾窗口 bounded replay 建立 Local KV，最终位置继续输出；固定 model.py 没有此分支。'],['输出与草稿初始化','LM Head → logits；DSpark 缓存初始化','参考代码返回各位置预测；生成流程使用末尾预测。forward_spec(start_pos=0) 只填 Draft 上下文 KV，返回 None。']],
 draft:[['来源 A + B','L37/38/39 Block 输入；主模型 t₀','各层 mean(四路) → [1,5120]，Concat [1,15360] × [15360,5120] → RMSNorm；B 建立 5 位置。'],['3 个 Draft Blocks','5 位置每层成块计算','main_x → 各 Draft 层自己的上下文 KV；草稿块内双向 Attention，无主干 Global / Indexer。'],['LM + Markov + Confidence','forward_spec 参考代码边界','5 组 base logits + 5 次轻量 Markov 采样 → [t₀,c₁…c₅]；另返回 5 raw confidence。'],['论文调度与主模型验证','论文流程；非 forward_spec 已实现','校准 confidence 选择候选前缀；同一主模型计算目标分布并按接受规则检查，提交接受前缀 + 纠正/补充 token。']]
 };
 function flow(){return `<h1>同一模型，三种不同执行场景</h1><div class="learn-scenario">${[['prefill','Prefill · 1024 输入'],['decode','Decode · 1024 历史 + 1 当前'],['draft','DSpark · Draft & Verify']].map(([k,t])=>`<button data-scenario="${k}" aria-pressed="${scenario===k}">${t}</button>`).join('')}</div><div class="learn-flow">${flows[scenario].map((s,i)=>`<section class="learn-card ${i===step?'current':''}"><h2>${i+1} → ${s[0]}</h2><strong>${s[1]}</strong><p>${s[2]}</p></section>`).join('')}</div><div class="learn-actions"><button id="learn-prev" ${step===0?'disabled':''}>上一步</button><span aria-live="polite">${step+1} / 4</span><button id="learn-next" ${step===3?'disabled':''}>下一步</button><button id="learn-reset">重置场景</button></div><div class="learn-boundary">位置数 ≠ 向量宽度：<b>[1024,512]</b> 是 1024 行、每行 512 维；<b>TopK 512</b> 是至多检索 512 条 Global；<b>Local 128</b> 是窗口位置上限（含当前）。<b>2:1 / 1:1</b> 是压缩比例；2:1 仅完整配对后增加条目。</div><div class="learn-grid" style="margin-top:16px"><section class="learn-card"><h2>Full / Reindex / Reuse</h2><p>Full：生成 Global KV、Index Key 并检索；Reindex：复用 KV / Key，重新打分选位置；Reuse：复用 KV 和已选位置。每层仍重算自己的 Q / Local KV。</p><p>Encoder：L0–1 仅 Local；L2/8/14 Full，之后至下一源层前 Reuse。Decoder：L20 Full，L24/28/32/36 Reindex，其余 Reuse。</p></section><section class="learn-card"><h2>三种分数去向不同</h2><p>Indexer 分数 → 筛 Global 位置；Attention 分数 → Local + Global 共同归一化后汇总；LM Head logits → 词表 token。缓存不是绕过 Decoder 直接生成 token 的路径。</p></section></div>${actions}<div class="learn-actions"><button data-detail="flow">进入原图逐步追踪</button><button data-draft="prefill">DSpark Prefill / Decode 细节</button></div>`;}
 function compute(){return `<h1>选择计算节点，再逐级展开</h1><p class="learn-intro">默认只看形状、核心公式与数量级；Level 2 看逻辑步骤，Level 3 保留完整权重与审计账本。Forward 默认 A：当前 1 token、1024 历史；Backward 默认 B：从起点重算 128 token 的理论实数图。</p><input class="learn-search" id="learn-search" aria-label="搜索计算模块" placeholder="搜索模块，如 Global、MoE、HC…"><div class="learn-module-grid" id="learn-modules">${Object.entries(DATA).map(([k,d])=>`<button data-module-open="${k}"><strong>${esc(d.title)}</strong><small>${esc(d.purpose)}</small></button>`).join('')}</div><p>参数量是存储权重；Activated 是当前 token 触达权重；FLOPs 是操作数；Memory Bytes 不属于 FLOPs。<a href="index.html">独立 Compute Lab（Roofline / MFU）</a> 使用各自建模假设，不是本模型实测性能。</p>`;}
 function evidence(){return `<h1>实现与证据</h1><p class="learn-intro">源码与配置固定到 revision <code>${ledger.revision}</code>。计算展示直接读取已有账本，未复制另一份 FLOPs 常量。</p><div class="learn-grid">${[['Verified','源码 / 配置：40 层主干、3 草稿层、5 位置、权重形状及共享关系。'],['Derived','给定实数计算图的数学推导；不等于官方训练 kernel 已验证。'],['Estimated','2MKN 矩阵近似及明示假设；不表示硬件运行时间。'],['Unknown','离散 TopK 梯度、量化训练策略、分布式 kernel / 通信、优化器成本及完整推测缓存提交回滚。']].map(([k,v])=>`<section class="learn-card"><h2>${k}</h2><p>${v}</p></section>`).join('')}</div><details><summary>审计清单、计数约定与原始来源</summary><p>普通加减乘逐项计数；exp / sqrt / rsqrt / div 等特殊函数单列。主路径与给定额外梯度的条件 VJP 分账；A 历史缓存梯度止于缓存，B 才从起点重算。</p><p><a href="references/deepseek/manifest.json">固定源 SHA256 清单</a> · <a href="references/deepseek/inference/model.py">model.py</a> · <a href="references/deepseek/inference/config.json">config.json</a> · <a href="references/deepseek/technical_report.pdf">本地技术报告</a> · <a href="https://arxiv.org/html/2607.05147v1">DSpark 论文</a></p><p>源码只包含草稿前向；概率校准 / prefix scheduler / 接受纠正 / 完整缓存推进属于论文或推理引擎。bounded replay 不在固定参考 model.py 中实现。没有运行模型权重或 GPU 性能测量。</p><button id="learn-audit">打开原参数总账与源码行号</button></details>`;}
 function render(){content.innerHTML=({overview,flow,compute,evidence})[workspace]();document.querySelectorAll('.learn-nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.workspace===workspace?'page':'false'));if(workspace==='compute')document.getElementById('learn-search').oninput=e=>{const q=e.target.value.toLowerCase();content.querySelectorAll('[data-module-open]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));};}
 function show(which='overview'){closePanel();if(informationFlow.state.enabled)document.getElementById('flow-toggle').click();active=true;workspace=which;document.body.classList.add('learning-on');render();root.scrollTop=0;}
 function detail(which){active=false;document.body.classList.remove('learning-on');closePanel();if(which==='flow'){document.getElementById('flow-toggle').click();return;}if(which==='attention'){const r=document.getElementById('region-select');r.value='attention';r.dispatchEvent(new Event('change',{bubbles:true}));attentionComparison.show();return;}if(which==='dspark'){dsparkArchitecture.show();return;}dsparkArchitecture.hide(false);const r=document.getElementById('region-select');r.value=which;r.dispatchEvent(new Event('change',{bubbles:true}));}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();if(b.dataset.workspace)show(b.dataset.workspace);if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.draft)dsparkArchitecture.detail(b.dataset.draft);if(b.dataset.scenario){scenario=b.dataset.scenario;step=0;render();}if(b.id==='learn-next'){step++;render();document.getElementById('learn-next').focus();}if(b.id==='learn-prev'){step--;render();document.getElementById('learn-prev').focus();}if(b.id==='learn-reset'){step=0;render();}if(b.dataset.moduleOpen){progressiveCompute.reset();document.querySelector('.modes [data-mode=forward]').click();openPanel(b.dataset.moduleOpen,b);document.getElementById('close-panel').focus();}if(b.id==='learn-audit'){document.getElementById('assumptions-toggle').click();}});
 document.getElementById('learn-return').onclick=e=>{e.stopPropagation();show(workspace);};
 for(const id of ['dspark-dialog','attention-comparison']){const dialog=document.getElementById(id);dialog?.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});}
 window.learningWorkspace={show,detail,get state(){return{active,workspace,scenario,step};}};
 if(!['#architecture','#dspark'].includes(location.hash))show();
})();
</script>
