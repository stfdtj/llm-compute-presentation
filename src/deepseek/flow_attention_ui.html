<!-- Step 4 teaching visuals; independent of calculation and audit data. -->
<style>
#attention-demo[hidden]{display:none!important}#attention-demo{margin-top:8px;padding-top:8px;border-top:1px solid #dae3f1;color:#29415f}.attention-head{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}.attention-head strong{color:#7443a5}.attention-controls{margin-left:auto;display:flex;align-items:center;gap:4px}.attention-controls button{font-size:11px;padding:3px 7px}.attention-tabs{display:flex;gap:5px;overflow:auto;margin:6px 0;padding-bottom:3px}.attention-tabs button{flex-shrink:0;font-size:11px;padding:4px 8px}.attention-tabs button[aria-selected=true]{background:#f1eaff;color:#70449b;border-color:#9160bd;box-shadow:inset 0 -2px #9160bd}.attention-scroll{overflow:auto;max-height:240px;background:#fbfcff;border:1px solid #dce5f2;border-radius:7px}.attention-scene{min-width:740px;padding:10px 12px;box-sizing:border-box}.attention-row{display:flex;align-items:center;justify-content:center;gap:12px}.attention-card{padding:8px 10px;border:1px solid var(--ink,#8850bc);background:var(--tint,#f7f0ff);border-radius:6px;min-width:115px}.attention-card h4{font-size:12px;color:var(--ink,#8850bc);margin:0 0 5px}.attention-card p{font-size:11px;line-height:1.6;margin:3px 0}.attention-dim{font:600 13px/1.5 Consolas,monospace;white-space:nowrap}.attention-q{--ink:#2863c5;--tint:#eef5ff}.attention-local{--ink:#208f88;--tint:#e9f8f5}.attention-global{--ink:#c77816;--tint:#fff4e4}.attention-out{--ink:#8850bc;--tint:#f7f0ff}.attention-op{text-align:center;font:600 13px/1.5 Consolas,monospace;color:#73518f;flex-shrink:0}.attention-op small{display:block;font:11px/1.5 'Microsoft YaHei',sans-serif;color:#61738c}.attention-arrow{font-size:22px;color:#8060a3}.attention-matrix{width:116px;border:1px solid #bbcadd;border-radius:3px;overflow:hidden;background:white;margin:5px auto}.matrix-band{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:3px;background:var(--tint)}.matrix-band i{height:5px;background:var(--ink);opacity:.7;border-radius:1px}.matrix-band.local{--ink:#208f88;--tint:#e9f8f5}.matrix-band.global{--ink:#c77816;--tint:#fff4e4}.matrix-band.query{--ink:#2863c5;--tint:#eef5ff}.matrix-band.output{--ink:#8850bc;--tint:#f7f0ff}.matrix-band.dimmed i{opacity:.12}.matrix-band.selected{outline:2px solid var(--ink);outline-offset:-2px}.attention-equation{font:13px/1.7 Consolas,monospace;text-align:center;color:#704598;margin-top:8px}.attention-code{font:11px/1.6 Consolas,monospace;white-space:pre-wrap;margin:6px 0;color:#45607d}.attention-cells{display:flex;gap:2px;align-items:flex-end;min-height:30px;margin:5px 0}.attention-cells i{display:block;flex:1;min-width:2px;background:#208f88;border-radius:2px}.attention-cells i.global{background:#c77816}.attention-fact{font-size:12px;line-height:1.6;margin:6px 0 0}.attention-scenario,.attention-proof{font-size:10px;color:#687c95;line-height:1.6;margin-top:4px}.attention-proof summary{cursor:pointer}.attention-proof p{margin:5px 0}.attention-group-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:5px 0}.attention-group-grid span{font-size:10px;border:1px solid #cbb5e0;border-radius:3px;padding:3px;background:#f7efff}.attention-repeat{border:2px solid #8e5ab8;box-shadow:0 0 0 3px #eee2fa}.attention-toy{display:flex;gap:10px;align-items:center;margin-top:8px;padding-top:7px;border-top:1px dashed #d5dfed;font-size:11px}.attention-toy input{width:120px}.attention-toy-values{display:flex;gap:8px}.attention-toy-value{width:86px;font-size:10px}.attention-toy-value i{display:block;height:7px;background:var(--ink);margin-top:3px;transition:width .2s}.attention-active .flow-message{display:none}.attention-active .flow-bottom{min-height:0;margin-top:5px;justify-content:space-between}.attention-animate{animation:attention-arrive .4s ease-out}@keyframes attention-arrive{from{transform:translateY(-12px);opacity:.25}to{transform:translateY(0);opacity:1}}@media(max-width:780px){.attention-head{font-size:11px;gap:4px}.attention-controls{margin-left:0}.attention-active .flow-bottom{display:flex}.attention-fact{font-size:11px}.attention-tabs button{padding:3px 6px}}@media(prefers-reduced-motion:reduce){.attention-animate{animation:none}.attention-toy-value i{transition:none}}
</style>
<style>
.attention-row{min-width:0;margin:0 auto}.matrix-band{gap:1px;padding:2px}.matrix-band i{height:4px}@media(max-width:780px){.attention-active .flow-bottom .flow-actions{flex-wrap:nowrap;gap:3px}.attention-active .flow-bottom button{font-size:10px;padding:3px 5px}.attention-active #flow-visual{flex-shrink:0}.attention-active .flow-bottom>.flow-actions{margin-top:5px}}
.attention-animate{animation:attention-stack .55s ease-out;overflow:hidden}@keyframes attention-stack{from{max-height:0;padding-top:0;padding-bottom:0;opacity:.25}to{max-height:100px;padding-top:2px;padding-bottom:2px;opacity:1}}@media(prefers-reduced-motion:reduce){.attention-animate{animation:none}}
</style>
<style>
.attention-row{width:max-content;min-width:0;margin:0 auto;justify-content:flex-start}.attention-scene{width:max-content;min-width:100%}.attention-proof[open]{max-height:120px;overflow:auto}.attention-active .flow-title{font-size:12px}@media(max-width:780px){.attention-active .flow-title{display:none}.attention-active .flow-top{flex-wrap:nowrap}.attention-head>span{display:none}.attention-controls{margin-left:auto}.attention-controls button{font-size:10px;padding:3px 4px}.attention-head strong{font-size:11px}.attention-proof[open]{max-height:100px}}
</style>
<script>
(()=>{
 const bar=document.getElementById('flow-bar'),demo=document.createElement('section');demo.id='attention-demo';demo.hidden=true;demo.setAttribute('aria-label','Layer 21 Attention 矩阵教学演示');
 demo.innerHTML=`<div class="attention-head"><strong>Layer 21 · 矩阵演示</strong><span>Verified · 运算关系</span><div class="attention-controls"><button id="attention-prev">← 上一段</button><span id="attention-counter" aria-live="polite">1/6</span><button id="attention-next">下一段 →</button><button id="attention-restart">重看</button></div></div><div class="attention-tabs" role="tablist" aria-label="Attention 六段演示"></div><div class="attention-scroll" tabindex="0" aria-label="矩阵关系，小屏可横向滑动"><div id="attention-scene" class="attention-scene" role="tabpanel"></div></div><p id="attention-fact" class="attention-fact" aria-live="polite"></p><div class="attention-scenario">教学场景：B=1 / 1 个 Query token；Local 128 行，Global 1024 行，Global Top-K 512 行。方格代表行组；维度数字按模型配置。独立于全页面 FLOPs 假设，小屏可横向滑动矩阵。</div><details class="attention-proof"><summary>源码依据 / 场景与计算边界</summary><p>Verified：核对审计固定的官方 5254448 版本 Attention._window_kv、_compress_kv、_compress_topk_idxs、forward 与 sparse_attn Kernel，并对照官方 main 对应代码。Layer 21 不是 KV / Index source，复用 Layer 20 缓存与索引。X21 为 HC 合并、RMSNorm 后的 Attention 输入；64 Head / 8 组为逻辑未分片形状。</p><p>这里取 Layer 20 写入后的 1024 个 Global 位置，ratio=1 时可对应 1023 个此前位置 + 当前位置。两个缓存可能包含相同 token，但拼接为独立槽位。高亮行仅为索引选择示意，不是运行中的真实选择结果。</p><p>Cache 是运行时数据；Concat / 复用不增加权重，Layer 21 不重复执行 Global 投影。本例 Scores 与 Weighted Sum 各约 2×640×512=655,360 FLOPs / Head（Estimated，乘加计 2），两次乘法分开计算，未包含归一化、sink、量化与位置处理。640 不修改全局审计假设；原有 Verified / Estimated / Unverified 与计算数据保留。</p><p>[1,640,512] 是逻辑读取视图，未声称分配 Gather 张量。实际 Kernel 按索引读取原缓存。缩小数字例子非模型实际数值；方格与动画是辅助可视化，不是新增模型层。</p><a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/5254448103b6254fc646dacbca1cbbf20e9216c1/inference/model.py" target="_blank" rel="noopener">官方 model.py（审计固定版本）</a> · <a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/5254448103b6254fc646dacbca1cbbf20e9216c1/inference/kernel.py" target="_blank" rel="noopener">官方 sparse_attn Kernel</a></details>`;bar.append(demo);
 const titles=['三条输入','Concat','Top-K 索引','Attention Scores','Softmax + 汇总','输出合并'],tabs=demo.querySelector('.attention-tabs'),scene=demo.querySelector('#attention-scene');let phase=0,active=false,toyQ=.5;
 titles.forEach((t,i)=>{const b=document.createElement('button');b.id='attention-tab-'+i;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls','attention-scene');b.textContent=(i+1)+' · '+t;b.addEventListener('click',()=>render(i));tabs.append(b);});
 const band=(type,rows=2,extra='')=>`<div class="matrix-band ${type} ${extra}">${'<i></i>'.repeat(rows*8)}</div>`;
 const matrix=(content)=>`<div class="attention-matrix" aria-hidden="true">${content}</div>`;
 const card=(name,dim,content='',kind='out',extra='')=>`<div class="attention-card attention-${kind} ${extra}"><h4>${name}</h4><div class="attention-dim">${dim}</div>${content}</div>`;
 const arrow='<span class="attention-arrow" aria-hidden="true">→</span>',op=(t,d='')=>`<div class="attention-op">${t}<small>${d}</small></div>`,eq=t=>`<div class="attention-equation">${t}</div>`;
 const bars=(weights=false)=>`<div class="attention-cells" aria-hidden="true">${Array.from({length:20},(_,i)=>`<i class="${i>=4?'global':''}" style="height:${weights?6+(i*7%23):8+(i*13%23)}px"></i>`).join('')}</div><p><span style="color:#208f88">Local 128</span> + <span style="color:#c77816">Global 512</span> · 640 项</p>`;
 const selected=()=>matrix(band('local',1,'selected')+band('global',4,'selected'));
 const views=[
 ()=>`<div class="attention-row">${card('Query · Layer 21 自己生成','Q [1,64,512]',`<p>X21 [1,5120]<br>× W_QA [5120,1280] → [1,1280]<br>RMSNorm<br>× W_QB [1280,32768] → [1,32768]<br>Reshape → 尾部 64 维 RoPE</p>${matrix(band('query',2))}`,'q')}${card('Local KV · Layer 21 自己生成','[1,128,512]',`<p>Attention Input [1,5120]<br>× W_KV_local [5120,512]<br>→ [1,512] → RMSNorm<br>→ RoPE → Local KV Cache<br>最多 128 个近期 / 当前位置</p>${matrix(band('local',2))}`,'local')}${card('Global KV · 复用 Layer 20','[1,1024,512]',`<p>Layer 20 Global KV Cache<br>↓ Layer 21 直接读取<br>没有新 Global Projection<br>同样复用 Layer 20 的索引<br>每行一份共享 Latent KV</p>${matrix(band('global',2))}`,'global')}</div>`,
 ()=>`<div class="attention-row"><div>${card('Local KV','[1,128,512]',matrix(band('local',1)),'local')}<div style="text-align:center;margin:3px">＋ <small>追加行，不做加法</small></div>${card('Global KV','[1,1024,512]',matrix(band('global',8)),'global')}</div>${op('torch.cat →','dim=1 · 位置维')}${card('Combined KV','[1,1152,512]',matrix(band('local',1)+band('global',8,'attention-animate'))+'<p>上：Local 行 0–127<br>下：Global 行 128–1151<br>特征宽度仍是 512</p>')}</div>${eq('[1,128,512] ⊕ [1,1024,512] → [1,1152,512]')}<pre class="attention-code">kv = torch.cat([kv, compress_kv], dim=1)</pre>`,
 ()=>`<div class="attention-row">${card('Combined KV · 候选行','[1,1152,512]',matrix(band('local',1,'selected')+Array.from({length:8},(_,i)=>band('global',1,i%2?'dimmed':'selected')).join(''))+'<p>Local 128 行全选<br>Global 1024 行中选 512 行<br>淡色行本次不访问</p>')}${op('topk_idxs →','按索引直接读原缓存')}${card('有效 KV · 逻辑读取视图','[1,640,512]',selected()+'<p>128 Local + 512 Global<br>相同行同时作 K 与 V<br>非实际分配的 Gather 声明</p>')}</div>${eq('索引 [1,1,128] ⊕ [1,1,512] → [1,1,640]')}<pre class="attention-code">topk_idxs = torch.cat([topk_idxs, compress_idxs], dim=-1)<br>Global 索引 j → Combined 行 128+j；索引拼接与 KV 拼接是不同操作。</pre>`,
 ()=>`<div class="attention-row">${card('64 Head 中的一个 Query','Q_head [1,512]',matrix(band('query',1))+'<p>当前 token 想查询什么？</p>','q')}${op('×','再除以 √512')}${card('同一份有效 KV · 转置','[512,640]','<div style="display:flex;gap:2px;width:164px;height:64px;margin:7px auto" aria-hidden="true"><div style="width:20%;background:#208f88"></div><div style="width:80%;background:#eeb86b"></div></div><p>纵轴：512 个特征<br>横轴：640 个选中位置</p>','out','attention-repeat')}${arrow}${card('Attention Scores','[1,640]',bars()+'<p>每个位置一个匹配分数<br>条高示意，非模型实际分数</p>')}</div>${eq('Scores = Q_head × KV_selectedᵀ / √512')}<pre class="attention-code">o = sparse_attn(q, kv, self.attn_sink, topk_idxs, self.softmax_scale)</pre>`,
 ()=>`<div class="attention-row">${card('Scores → 共同归一化','[1,640]',bars()+op('一次 Softmax','Local + Global + Sink 同一分母'))}${arrow}${card('Attention Weights','[1,640]',bars(true)+'<p>640 个 KV 权重<br>Sink 进分母，不提供 Value<br>这些权重之和可能小于 1</p>')}${op('×','Weighted Sum')}${card('刚才的 KV 再作 Value','[640,512]',selected()+'<p>同一批 Local / Global 行<br>提供被加权汇总的信息</p>','out','attention-repeat')}${arrow}${card('O_head','[1,512]',matrix(band('output',1)))}</div>${eq('O_head = Weights × KV_selected')}<div class="attention-toy"><label>缩小教学例：2 维 / 3 行<br>Q=[1, <output id="toy-query">0.5</output>]<br><input id="attention-toy-query" type="range" min="-1" max="2" step="0.1" value="${toyQ}" aria-label="教学例 Query 第二个特征"></label><div><div class="attention-toy-values">${[['Local [1,0]','local'],['Global [0,1]','global'],['Global [1,1]','global']].map(([t,c],i)=>`<div class="attention-toy-value attention-${c}">${t}<br>w=<span id="toy-weight-${i}"></span><i id="toy-bar-${i}"></i></div>`).join('')}</div><p id="toy-output" style="margin:4px 0"></p><small>分数除以 √2，Sink logit=0 为本例条件；模型公式仍为 512 维。</small></div></div>`,
 ()=>`<div class="attention-row">${card('64 Head 的输出','[1,64,512]',matrix(band('output',3))+'<p>尾部 Inverse RoPE<br>Reshape → [1,8,4096]<br>每组 8 Head × 512</p>')}${arrow}${card('8 组独立 W_OA 投影','[1,8,4096]',`<div class="attention-group-grid">${Array.from({length:8},(_,i)=>`<span>组 ${i+1}<br>4096 → 1024</span>`).join('')}</div><p>每组自己的 [4096,1024] 矩阵<br>输出 [1,8,1024]<br>分组 einsum 前有量化 / 反量化</p>`)}${op('Flatten →','[1,8192]')}${card('W_OB · 第二级投影','[8192,5120]','<p>[1,8192] × [8192,5120]<br>↓</p><div class="attention-dim">[1,5120]</div><p>通过 HC 更新 Hidden State</p>','q')}</div>${eq('8 × ([1,4096] × [4096,1024]) → [1,8,1024] → [1,8192] → [1,5120]')}<pre class="attention-code">o = einsum("bsgd,grd-&gt;bsgr", o, wo_a)<br>x = wo_b(o.flatten(2))</pre>`
 ];
 const facts=['Query 与 Local 来自 Layer 21；Global 缓存来自 Layer 20，复用省去重复投影。','两叠 KV 上下接在一起：128+1024=1152 行，宽度 512 不变，没有逐元素相加或覆盖。','拼接决定候选张量；索引决定访问哪些行。边框高亮本次读取位置，淡色行不参与本次运算。','Query 与每个选中位置的 512 维向量比较，得到 640 个分数；Global 在这里用于匹配。','Local / Global 一起归一化。刚才用于匹配的同一份 KV 再按权重汇总；Global 也贡献输出内容。','每个 Head 的 512 维归入 8 组，各自降至 1024 维，再拼成 8192 维，由 W_OB 投影回 5120 维。'];
 function updateToy(){const scores=[1,toyQ,1+toyQ].map(x=>x/Math.sqrt(2)),den=scores.reduce((s,x)=>s+Math.exp(x),1),w=scores.map(x=>Math.exp(x)/den);demo.querySelector('#toy-query').textContent=toyQ.toFixed(1);w.forEach((x,i)=>{demo.querySelector('#toy-weight-'+i).textContent=x.toFixed(3);demo.querySelector('#toy-bar-'+i).style.width=(x*100)+'%';});demo.querySelector('#toy-output').textContent=`O = ${w[0].toFixed(3)}·[1,0] + ${w[1].toFixed(3)}·[0,1] + ${w[2].toFixed(3)}·[1,1] = [${(w[0]+w[2]).toFixed(3)}, ${(w[1]+w[2]).toFixed(3)}]；Sink 权重 ${(1/den).toFixed(3)}`;return{weights:w,sink:1/den,output:[w[0]+w[2],w[1]+w[2]]};}
 function render(n){phase=Math.max(0,Math.min(5,n));scene.innerHTML=views[phase]();demo.querySelector('#attention-counter').textContent=(phase+1)+'/6';demo.querySelector('#attention-prev').disabled=phase===0;demo.querySelector('#attention-next').disabled=phase===5;tabs.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===phase));b.tabIndex=i===phase?0:-1;});demo.querySelector('#attention-fact').textContent=facts[phase];demo.querySelector('.attention-scroll').scrollTo(0,0);if(phase===4){updateToy();demo.querySelector('#attention-toy-query').addEventListener('input',e=>{toyQ=Number(e.target.value);updateToy();});}fit();}
 function fit(){if(!active)return;const area=demo.querySelector('.attention-scroll'),b=bar.getBoundingClientRect(),chrome=b.height-area.getBoundingClientRect().height;area.style.maxHeight=Math.max(90,Math.min(innerWidth<=780?210:240,innerHeight-31-9-190-b.top-chrome))+'px';document.documentElement.style.setProperty('--flow-stage-top',(bar.getBoundingClientRect().bottom+9)+'px');}
 function sync(){const on=informationFlow.state.enabled&&informationFlow.state.step===4;if(on===active)return;active=on;demo.hidden=!on;bar.classList.toggle('attention-active',on);if(on)render(0);fit();}
 demo.querySelector('#attention-prev').addEventListener('click',()=>render(phase-1));demo.querySelector('#attention-next').addEventListener('click',()=>render(phase+1));demo.querySelector('#attention-restart').addEventListener('click',()=>render(0));tabs.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();render(e.key==='Home'?0:e.key==='End'?5:phase+(e.key==='ArrowLeft'?-1:1));tabs.children[phase].focus();}});
 demo.querySelector('.attention-scenario').textContent='教学条件：Local 128 / Global 1024 / Top-K 512 → 有效 640 行；不改审计。方格为行组，小屏横滑。';demo.querySelector('.attention-proof').addEventListener('toggle',fit);
 new MutationObserver(sync).observe(document.getElementById('flow-counter'),{childList:true,characterData:true,subtree:true});new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']});window.addEventListener('resize',()=>requestAnimationFrame(fit));
 window.attentionTeaching={get state(){return{active,phase:phase+1,scenario:{local:128,global:1024,globalSelected:512,effective:640,features:512},toyQ}},select:render,toyResult:()=>phase===4?updateToy():null};
})();
</script>
